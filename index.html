    const DB_NAME = "HolidayReportsDB";
    const DB_VERSION = 1;
    const STORE_NAME = "app_data";

    const idb = {
      open() {
        return new Promise((resolve, reject) => {
          if (!window.indexedDB) {
            reject(new Error("IndexedDB no soportado"));
            return;
          }
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME);
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      },
      async get(key) {
        try {
          const db = await this.open();
          return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, "readonly");
            const store = tx.objectStore(STORE_NAME);
            const req = store.get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
          });
        } catch {
          return null;
        }
      },
      async set(key, val) {
        try {
          const db = await this.open();
          return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, "readwrite");
            const store = tx.objectStore(STORE_NAME);
            const req = store.put(val, key);
            req.onsuccess = () => resolve();
            req.onerror = () => reject(req.error);
          });
        } catch (e) {
          console.error("Error guardando en IndexedDB:", e);
        }
      }
    };

    function parseTimeToMinutes(tStr) {
      if (!tStr) return null;
      const clean = tStr.trim().toUpperCase();
      const match = clean.match(/(\d+):(\d+)(?::\d+)?\s*(AM|PM)?/);
      if (!match) return null;
      let hours = parseInt(match[1], 10);
      const minutes = parseInt(match[2], 10);
      const ampm = match[3];
      if (ampm === "PM" && hours < 12) hours += 12;
      if (ampm === "AM" && hours === 12) hours = 0;
      return hours * 60 + minutes;
    }

    // Calcula horas trabajadas numéricas y formato string
    function calculateHoursWorked(agent) {
      if (!agent) return { hours: 0, text: "0.0 hrs" };

      // Caso: No Required to Come -> 0 Horas
      if (agent.commentType === "Not Required to Come" || !agent.isRequired) {
        return { hours: 0, text: "0.0 hrs" };
      }

      // Caso: Shift Completed -> 9.0 Horas (o turno regular)
      if (agent.commentType === "Shift Completed") {
        return { hours: 9, text: "9.0 hrs" };
      }

      // Caso: Early Out at -> Desde CheckIn hasta la hora que se fue (commentDetail)
      if (agent.commentType === "Early Out at") {
        const startM = parseTimeToMinutes(agent.checkIn);
        const exitM = parseTimeToMinutes(agent.commentDetail);
        if (startM !== null && exitM !== null) {
          let diff = exitM - startM;
          if (diff < 0) diff += 1440; // Si cruza medianoche
          const hrs = Math.max(0, diff / 60);
          return { hours: hrs, text: `${hrs.toFixed(1)} hrs` };
        }
        return { hours: 0, text: "Pending Time" };
      }

      // Caso: Late In at -> Desde la hora que llegó (commentDetail) hasta CheckOut
      if (agent.commentType === "Late In at") {
        const lateArrivalM = parseTimeToMinutes(agent.commentDetail);
        const endM = parseTimeToMinutes(agent.checkOut);
        if (lateArrivalM !== null && endM !== null) {
          let diff = endM - lateArrivalM;
          if (diff < 0) diff += 1440; // Si cruza medianoche
          const hrs = Math.max(0, diff / 60);
          return { hours: hrs, text: `${hrs.toFixed(1)} hrs` };
        }
        return { hours: 0, text: "Pending Time" };
      }

      return { hours: 9, text: "9.0 hrs" };
    }

    function parseHolidayDateWeight(holidayObj, index) {
      if (!holidayObj || !holidayObj.name) return index;
      const text = holidayObj.name;
      const parenMatch = text.match(/\(([^)]+)\)/);
      let dateStrToParse = parenMatch ? parenMatch[1] : text;
      dateStrToParse = dateStrToParse.replace(/Observed\s*[-–]?\s*/i, "").trim();

      const parsed = Date.parse(dateStrToParse);
      if (!isNaN(parsed)) {
        return parsed;
      }
      const matchMonthDay = dateStrToParse.match(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+(\d{1,2})(?:,?\s*(\d{4}))?/i);
      if (matchMonthDay) {
        const year = matchMonthDay[3] || "2026";
        const parsedManual = Date.parse(`${matchMonthDay[1]} ${matchMonthDay[2]}, ${year}`);
        if (!isNaN(parsedManual)) return parsedManual;
      }
      return 9999999999000 + index;
    }

      const [newHolidayDate, setNewHolidayDate] = useState("");

      // ORDEN AUTOMÁTICO DE LOS FERIADOS: DEL MÁS ANTIGUO (ARRIBA) AL MÁS NUEVO (ABAJO)
      const sortedHolidaysList = useMemo(() => {
        return [...holidaysList].sort((a, b) => {
          const indexA = holidaysList.indexOf(a);
          const indexB = holidaysList.indexOf(b);
          return parseHolidayDateWeight(a, indexA) - parseHolidayDateWeight(b, indexB);
        });
      }, [holidaysList]);

      const staff = useMemo(() => {
        return holidaysData[selectedHolidayId] || INITIAL_ROSTER;
      }, [holidaysData, selectedHolidayId]);

      const setStaff = (updater) => {
        setHolidaysData(prev => {
          const currentList = prev[selectedHolidayId] || INITIAL_ROSTER;
          const nextList = typeof updater === "function" ? updater(currentList) : updater;
          const updatedState = { ...prev, [selectedHolidayId]: nextList };
          idb.set("OFFICIAL_HOLIDAY_REPORTS_V4", updatedState);
          return updatedState;
        });
      };

      const handleSaveHolidayManually = async () => {
        try {
          await idb.set("OFFICIAL_HOLIDAY_REPORTS_V4", holidaysData);
          await idb.set("OFFICIAL_HOLIDAYS_CATALOG", holidaysList);
          setSaveNotice("Holiday report data saved successfully!");
          setTimeout(() => setSaveNotice(""), 3500);
        } catch (e) {
          alert("Error guardando: " + e.message);
        }
      };

      // GUARDA LOS AGENTES GLOBALES EN TODOS LOS FERIADOS
      const handleSaveTeamGlobally = async () => {
        try {
          const currentAgents = holidaysData[selectedHolidayId] || INITIAL_ROSTER;
          const updatedHolidaysData = { ...holidaysData };

          const allHolidayIds = holidaysList.map(h => h.id);
          if (!allHolidayIds.includes(selectedHolidayId)) {
            allHolidayIds.push(selectedHolidayId);
          }

          allHolidayIds.forEach(holidayId => {
            const holidayRoster = holidaysData[holidayId] || INITIAL_ROSTER;
            const existingMap = new Map(holidayRoster.map(a => [a.id, a]));

            const newHolidayRoster = currentAgents.map(currentAgent => {
              const existing = existingMap.get(currentAgent.id);
              if (existing) {
                return {
                  ...currentAgent,
                  isRequired: existing.isRequired,
                  commentType: existing.commentType,
                  commentDetail: existing.commentDetail
                };
              } else {
                return { ...currentAgent };
              }
            });

            updatedHolidaysData[holidayId] = newHolidayRoster;
          });

          setHolidaysData(updatedHolidaysData);
          await idb.set("OFFICIAL_HOLIDAY_REPORTS_V4", updatedHolidaysData);

          setSaveNotice("Team changes (added, edited, or removed agents) successfully saved across ALL holidays!");
          setTimeout(() => setSaveNotice(""), 4500);
        } catch (e) {
          alert("Error guardando equipo globalmente: " + e.message);
        }
      };

      const handleCreateHoliday = async (e) => {
        e.preventDefault();
        if (!newHolidayName.trim()) {
          alert("El nombre del feriado es obligatorio.");
          return;
        }

        const formattedLabel = newHolidayDate.trim()
          ? `${newHolidayName.trim()} (${newHolidayDate.trim()})`
          : newHolidayName.trim();

        const newId = "holiday-" + Date.now();
        const updatedList = [...holidaysList, { id: newId, name: formattedLabel }];
        setHolidaysList(updatedList);
        await idb.set("OFFICIAL_HOLIDAYS_CATALOG", updatedList);

        const currentTemplate = holidaysData[selectedHolidayId] || INITIAL_ROSTER;
        const updatedData = { ...holidaysData, [newId]: currentTemplate };
        setHolidaysData(updatedData);
        await idb.set("OFFICIAL_HOLIDAY_REPORTS_V4", updatedData);

        setSelectedHolidayId(newId);
        setNewHolidayName("");
        setNewHolidayDate("");
        setIsNewHolidayModalOpen(false);
      };

      // ELIMINAR FERIADO ACTUAL
      const executeRemoveHoliday = async (holidayIdToRemove) => {
        if (holidaysList.length <= 1) {
          alert("At least one holiday must remain in the catalog.");
          return;
        }

        const updatedList = holidaysList.filter(h => h.id !== holidayIdToRemove);
        const updatedData = { ...holidaysData };
        delete updatedData[holidayIdToRemove];

        setHolidaysList(updatedList);
        setHolidaysData(updatedData);

        await idb.set("OFFICIAL_HOLIDAYS_CATALOG", updatedList);
        await idb.set("OFFICIAL_HOLIDAY_REPORTS_V4", updatedData);

        const nextSelected = updatedList[0]?.id || "labor";
        setSelectedHolidayId(nextSelected);
        setSelectedAgentIds(new Set());

        setSaveNotice("Holiday removed successfully!");
        setTimeout(() => setSaveNotice(""), 3500);
      };

      // Filtros
      const [filterCountry, setFilterCountry] = useState("Guatemala");
      const [searchTerm, setSearchTerm] = useState("");
      const [filterTeam, setFilterTeam] = useState("ALL");
      const [filterSupervisor, setFilterSupervisor] = useState("ALL");
      const [filterRequirement, setFilterRequirement] = useState("ALL");
      const [filterComment, setFilterComment] = useState("ALL");

      // Modales de autorización
      const [isCountryAuthOpen, setIsCountryAuthOpen] = useState(false);
      const [targetCountry, setTargetCountry] = useState("");
      const [countryPasswordInput, setCountryPasswordInput] = useState("");
      const [countryAuthError, setCountryAuthError] = useState("");

      const [isMgmtAuthModalOpen, setIsMgmtAuthModalOpen] = useState(false);
      const [mgmtActionPayload, setMgmtActionPayload] = useState(null);
      const [mgmtPasswordInput, setMgmtPasswordInput] = useState("");
      const [mgmtAuthError, setMgmtAuthError] = useState("");

      const [isAgentModalOpen, setIsAgentModalOpen] = useState(false);
      const [modalMode, setModalMode] = useState("add");
      const [currentAgentData, setCurrentAgentData] = useState({
        id: "",
        name: "",
        country: "Guatemala",
        team: "Management",
        supervisor: "Jorge Garrido",
        checkIn: "07:00:00 AM",
        checkOut: "04:00:00 PM",
        isRequired: true,
        commentType: "Shift Completed",
        commentDetail: ""
      });

      // MODAL DE EDICIÓN MASIVA
      const [isBulkEditModalOpen, setIsBulkEditModalOpen] = useState(false);
      const [bulkEditFields, setBulkEditFields] = useState({
        team: "",
        supervisor: "",
        checkIn: "",
        checkOut: "",
        isRequired: "",
        commentType: "",
        commentDetail: ""
      });

      // DISPATCHER & AVAILABILITY CALCULATOR
      const [isAvailabilityModalOpen, setIsAvailabilityModalOpen] = useState(false);
      const [targetPercentage, setTargetPercentage] = useState(80);
      const [availabilityResult, setAvailabilityResult] = useState(null);

      const handleCountrySelectChange = (e) => {
        const selected = e.target.value;
        if (selected === filterCountry) return;

        if (selected === "ALL") {
          triggerMgmtProtectedAction("SELECT_ALL_COUNTRIES", null);
          return;
        }

        setTargetCountry(selected);
        setCountryPasswordInput("");
        setCountryAuthError("");
        setIsCountryAuthOpen(true);
      };

      const handleVerifyCountryPassword = (e) => {
        e?.preventDefault();
        const requiredPass = COUNTRY_PASSWORDS[targetCountry];
        if (countryPasswordInput === requiredPass) {
          setFilterCountry(targetCountry);
          setIsCountryAuthOpen(false);
          setSelectedAgentIds(new Set());
        } else {
          setCountryAuthError(`Contraseña incorrecta para ${targetCountry}.`);
        }
      };

      const teams = useMemo(() => {
        const countryStaff = filterCountry === "ALL" 
          ? staff 
          : staff.filter(s => s.country === filterCountry);
        return ["ALL", ...new Set(countryStaff.map(s => s.team))].sort();
      }, [staff, filterCountry]);

      const supervisors = useMemo(() => {
        const countryStaff = filterCountry === "ALL" 
          ? staff 
          : staff.filter(s => s.country === filterCountry);
        return ["ALL", ...new Set(countryStaff.map(s => s.supervisor))].sort();
      }, [staff, filterCountry]);

      const countryStaffAll = useMemo(() => {
        return filterCountry === "ALL" 
          ? staff 
          : staff.filter(s => s.country === filterCountry);
      }, [staff, filterCountry]);

      const totalStaff = countryStaffAll.length;
      const requiredCount = countryStaffAll.filter(s => s.isRequired).length;
      const notRequiredCount = totalStaff - requiredCount;
      const completedCount = countryStaffAll.filter(s => s.commentType === "Shift Completed").length;
      const exceptionsCount = countryStaffAll.filter(s => s.commentType === "Early Out at" || s.commentType === "Late In at").length;

      const filteredStaff = useMemo(() => {
        return staff.filter(agent => {
          if (filterCountry !== "ALL" && agent.country !== filterCountry) return false;

          const matchSearch =
            agent.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            agent.supervisor.toLowerCase().includes(searchTerm.toLowerCase()) ||
            agent.team.toLowerCase().includes(searchTerm.toLowerCase());
          const matchTeam = filterTeam === "ALL" || agent.team === filterTeam;
          const matchSupervisor = filterSupervisor === "ALL" || agent.supervisor === filterSupervisor;
          const matchReq =
            filterRequirement === "ALL"
              ? true
              : filterRequirement === "REQUIRED"
              ? agent.isRequired
              : !agent.isRequired;
          const matchComment = filterComment === "ALL" || agent.commentType === filterComment;

          return matchSearch && matchTeam && matchSupervisor && matchReq && matchComment;
        });
      }, [staff, filterCountry, searchTerm, filterTeam, filterSupervisor, filterRequirement, filterComment]);

      // SELECCIÓN MÚLTIPLE HELPERS
      const areAllFilteredSelected = useMemo(() => {
        if (filteredStaff.length === 0) return false;
        return filteredStaff.every(a => selectedAgentIds.has(a.id));
      }, [filteredStaff, selectedAgentIds]);

      const toggleSelectAllFiltered = () => {
        setSelectedAgentIds(prev => {
          const next = new Set(prev);
          if (areAllFilteredSelected) {
            filteredStaff.forEach(a => next.delete(a.id));
          } else {
            filteredStaff.forEach(a => next.add(a.id));
          }
          return next;
        });
      };

      const toggleSelectAgent = (id) => {
        setSelectedAgentIds(prev => {
          const next = new Set(prev);
          if (next.has(id)) {
            next.delete(id);
          } else {
            next.add(id);
          }
          return next;
        });
      };

      // MOTOR DE DISPONIBILIDAD REACTIVO
      const runAvailabilityOptimization = (pct = targetPercentage) => {
        const agents = [...countryStaffAll];
        const total = agents.length;
        if (total === 0) return;

        const targetCount = Math.round((pct / 100) * total);

        const phoneAgents = [];
        const caseAgents = [];
        const managementAgents = [];
        const otherAgents = [];

        agents.forEach(a => {
          const t = a.team.toLowerCase();
          if (t.includes("phone")) {
            phoneAgents.push(a);
          } else if (t.includes("case") || t.includes("after hours")) {
            caseAgents.push(a);
          } else if (t.includes("management")) {
            managementAgents.push(a);
          } else {
            otherAgents.push(a);
          }
        });

        const sortByShift = (arr) => {
          return arr.sort((a, b) => (parseTimeToMinutes(a.checkIn) || 480) - (parseTimeToMinutes(b.checkIn) || 480));
        };

        sortByShift(phoneAgents);
        sortByShift(caseAgents);
        sortByShift(managementAgents);
        sortByShift(otherAgents);

        const selectEvenly = (arr, countNeeded) => {
          if (countNeeded <= 0) return { selected: [], rest: arr };
          if (countNeeded >= arr.length) return { selected: [...arr], rest: [] };

          const selected = [];
          const step = (arr.length - 1) / Math.max(countNeeded - 1, 1);
          const pickedIndices = new Set();

          for (let i = 0; i < countNeeded; i++) {
            const idx = Math.min(Math.round(i * step), arr.length - 1);
            pickedIndices.add(idx);
          }

          let cur = 0;
          while (pickedIndices.size < countNeeded && cur < arr.length) {
            pickedIndices.add(cur);
            cur++;
          }

          const rest = [];
          arr.forEach((item, index) => {
            if (pickedIndices.has(index)) {
              selected.push(item);
            } else {
              rest.push(item);
            }
          });

          return { selected, rest };
        };

        const phoneTarget = Math.round((phoneAgents.length / total) * targetCount);
        const caseTarget = Math.round((caseAgents.length / total) * targetCount);
        const mgmtTarget = Math.round((managementAgents.length / total) * targetCount);
        const otherTarget = targetCount - (phoneTarget + caseTarget + mgmtTarget);

        const pPick = selectEvenly(phoneAgents, phoneTarget);
        const cPick = selectEvenly(caseAgents, caseTarget);
        const mPick = selectEvenly(managementAgents, mgmtTarget);
        const oPick = selectEvenly(otherAgents, Math.max(0, otherTarget));

        let selectedStaff = [
          ...pPick.selected,
          ...cPick.selected,
          ...mPick.selected,
          ...oPick.selected
        ];

        let leftover = [
          ...pPick.rest,
          ...cPick.rest,
          ...mPick.rest,
          ...oPick.rest
        ];

        if (selectedStaff.length < targetCount && leftover.length > 0) {
          const needed = targetCount - selectedStaff.length;
          selectedStaff.push(...leftover.slice(0, needed));
        } else if (selectedStaff.length > targetCount) {
          selectedStaff = selectedStaff.slice(0, targetCount);
        }

        const selectedIds = new Set(selectedStaff.map(a => a.id));

        const scheduleBreakdown = {};
        selectedStaff.forEach(a => {
          const key = `${a.checkIn} - ${a.checkOut}`;
          scheduleBreakdown[key] = (scheduleBreakdown[key] || 0) + 1;
        });

        const phoneSchedules = selectedStaff.filter(a => a.team.toLowerCase().includes("phone")).map(a => a.checkIn);
        const covers6AM = phoneSchedules.some(s => (parseTimeToMinutes(s) || 9999) <= 360);
        const covers7PM = selectedStaff.filter(a => a.team.toLowerCase().includes("phone")).some(a => (parseTimeToMinutes(a.checkOut) || 0) >= 1140);

        setAvailabilityResult({
          percentage: pct,
          total: total,
          recommendedCount: selectedStaff.length,
          offCount: total - selectedStaff.length,
          selectedIds,
          scheduleBreakdown,
          phoneAgentsCount: selectedStaff.filter(a => a.team.toLowerCase().includes("phone")).length,
          caseAgentsCount: selectedStaff.filter(a => a.team.toLowerCase().includes("case") || a.team.toLowerCase().includes("after hours")).length,
          managementCount: selectedStaff.filter(a => a.team.toLowerCase().includes("management")).length,
          covers6AM,
          covers7PM
        });
      };

      const triggerMgmtProtectedAction = (actionType, payload) => {
        setMgmtActionPayload({ type: actionType, payload });
        setMgmtPasswordInput("");
        setMgmtAuthError("");
        setIsMgmtAuthModalOpen(true);
      };

      const handleVerifyMgmtPassword = (e) => {
        e?.preventDefault();
        if (mgmtPasswordInput === MANAGEMENT_AUTH_PASSWORD) {
          setIsMgmtAuthModalOpen(false);
          const { type, payload } = mgmtActionPayload;

          if (type === "SELECT_ALL_COUNTRIES") {
            setFilterCountry("ALL");
          } else if (type === "ADD_MODAL") {
            setModalMode("add");
            setCurrentAgentData({
              id: "EMP-" + Date.now().toString().slice(-4),
              name: "",
              country: filterCountry === "ALL" ? "Guatemala" : filterCountry,
              team: teams[1] || "Management",
              supervisor: supervisors[1] || "",
              checkIn: "07:00:00 AM",
              checkOut: "04:00:00 PM",
              isRequired: true,
              commentType: "Shift Completed",
              commentDetail: ""
            });
            setIsAgentModalOpen(true);
          } else if (type === "EDIT_MODAL") {
            setModalMode("edit");
            setCurrentAgentData({ ...payload });
            setIsAgentModalOpen(true);
          } else if (type === "DELETE_AGENT") {
            setStaff(prev => prev.filter(a => a.id !== payload.id));
            setSelectedAgentIds(prev => {
              const next = new Set(prev);
              next.delete(payload.id);
              return next;
            });
          } else if (type === "BULK_DELETE") {
            const idsToDelete = payload;
            setStaff(prev => prev.filter(a => !idsToDelete.has(a.id)));
            setSelectedAgentIds(new Set());
            setSaveNotice(`${idsToDelete.size} agents removed successfully!`);
            setTimeout(() => setSaveNotice(""), 3500);
          } else if (type === "BULK_EDIT_MODAL") {
            setBulkEditFields({
              team: "",
              supervisor: "",
              checkIn: "",
              checkOut: "",
              isRequired: "",
              commentType: "",
              commentDetail: ""
            });
            setIsBulkEditModalOpen(true);
          } else if (type === "REMOVE_HOLIDAY") {
            executeRemoveHoliday(payload);
          }
        } else {
          setMgmtAuthError("Contraseña de gestión incorrecta.");
        }
      };

      const handleSaveAgentForm = (e) => {
        e.preventDefault();
        if (!currentAgentData.name.trim()) {
          alert("El nombre del agente es obligatorio.");
          return;
        }

        if (modalMode === "add") {
          setStaff(prev => [currentAgentData, ...prev]);
        } else {
          setStaff(prev => prev.map(a => a.id === currentAgentData.id ? currentAgentData : a));
        }
        setIsAgentModalOpen(false);
      };

      // GUARDADO DE EDICIÓN EN LOTE
      const handleSaveBulkEditForm = (e) => {
        e.preventDefault();
        setStaff(prev =>
          prev.map(agent => {
            if (selectedAgentIds.has(agent.id)) {
              const updated = { ...agent };
              if (bulkEditFields.team.trim()) updated.team = bulkEditFields.team.trim();
              if (bulkEditFields.supervisor.trim()) updated.supervisor = bulkEditFields.supervisor.trim();
              if (bulkEditFields.checkIn.trim()) updated.checkIn = bulkEditFields.checkIn.trim();
              if (bulkEditFields.checkOut.trim()) updated.checkOut = bulkEditFields.checkOut.trim();
              if (bulkEditFields.isRequired !== "") {
                updated.isRequired = bulkEditFields.isRequired === "true";
              }
              if (bulkEditFields.commentType) {
                updated.commentType = bulkEditFields.commentType;
                if (bulkEditFields.commentType === "Not Required to Come") {
                  updated.isRequired = false;
                  updated.commentDetail = bulkEditFields.commentDetail || "Holiday Rested";
                } else if (bulkEditFields.commentType === "Shift Completed") {
                  updated.commentDetail = "";
                } else if (bulkEditFields.commentDetail) {
                  updated.commentDetail = bulkEditFields.commentDetail;
                }
              }
              return updated;
            }
            return agent;
          })
        );
        setIsBulkEditModalOpen(false);
        setSaveNotice(`${selectedAgentIds.size} agents updated successfully!`);
        setTimeout(() => setSaveNotice(""), 3500);
      };

      const updateAgentField = (id, field, value) => {
        setStaff(prev =>
          prev.map(agent => {
            if (agent.id === id) {
              const updated = { ...agent, [field]: value };
              if (field === "commentType") {
                if (value === "Not Required to Come") {
                  updated.isRequired = false;
                  if (!NOT_REQUIRED_REASONS.includes(updated.commentDetail)) {
                    updated.commentDetail = "Holiday Rested";
                  }
                } else if (value === "Shift Completed") {
                  updated.isRequired = true;
                  updated.commentDetail = "";
                } else {
                  updated.isRequired = true;
                  if (NOT_REQUIRED_REASONS.includes(updated.commentDetail)) {
                    updated.commentDetail = "";
                  }
                }
              }
              return updated;
            }
            return agent;
          })
        );
      };

      const handleBulkRequirement = (status) => {
        const idsToUpdate = new Set(filteredStaff.map(s => s.id));
        setStaff(prev =>
          prev.map(agent =>
            idsToUpdate.has(agent.id)
              ? {
                  ...agent,
                  isRequired: status,
                  commentType: status ? (agent.commentType === "Not Required to Come" ? "Shift Completed" : agent.commentType) : "Not Required to Come",
                  commentDetail: status ? "" : "Holiday Rested"
                }
              : agent
          )
        );
      };

      const handleExportToExcel = () => {
        const holidayObj = holidaysList.find(h => h.id === selectedHolidayId);
        const exportData = filteredStaff.map((agent, index) => {
          let detailLabel = agent.commentDetail || "N/A";
          let fullStatus = agent.commentType;
          if (agent.commentType === "Not Required to Come") {
            fullStatus = `Not Required to Come (${agent.commentDetail || "Holiday Rested"})`;
          } else if (agent.commentType === "Early Out at" || agent.commentType === "Late In at") {
            fullStatus = `${agent.commentType} ${agent.commentDetail || "Time Unspecified"}`;
          }

          const hoursCalc = calculateHoursWorked(agent);

          return {
            "No.": index + 1,
            "Full Name": agent.name,
            "Country": agent.country,
            "Team": agent.team,
            "Direct Supervisor": agent.supervisor,
            "Check In": agent.checkIn,
            "Check Out": agent.checkOut,
            "Required to Work": agent.isRequired ? "YES" : "NO",
            "Main Status": agent.commentType,
            "Status Detail / Reason": detailLabel,
            "Total Hours Worked": hoursCalc.text,
            "Full Status Summary": fullStatus,
            "Official Holiday": holidayObj?.name || selectedHolidayId
          };
        });

        const worksheet = XLSX.utils.json_to_sheet(exportData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, `${filterCountry} Roster`);

        const colWidths = [
          { wch: 6 },
          { wch: 32 },
          { wch: 15 },
          { wch: 22 },
          { wch: 22 },
          { wch: 16 },
          { wch: 16 },
          { wch: 18 },
          { wch: 22 },
          { wch: 22 },
          { wch: 20 },
          { wch: 38 },
          { wch: 38 }
        ];
        worksheet["!cols"] = colWidths;

        const holidaySlug = (holidayObj?.name || selectedHolidayId).replace(/[^a-zA-Z0-9]/g, "_");
        XLSX.writeFile(workbook, `OFFICIAL_HOLIDAY_REPORT_${filterCountry}_${holidaySlug}.xlsx`);
      };

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [
        selectedHolidayId,
        holidaysList,
        sortedHolidaysList,
        holidaysData,
        filterCountry,
        filteredStaff,
        isDarkMode,
        isAvailabilityModalOpen,
        availabilityResult,
        targetPercentage,
        selectedAgentIds
      ]);

      return (
        <div className={`flex flex-col min-h-screen ${isDarkMode ? "bg-slate-950 text-slate-100" : "bg-slate-50 text-slate-800"}`}>
          {/* HEADER PRINCIPAL */}
          <header className={`border-b sticky top-0 z-30 shadow-xl backdrop-blur-md transition-colors ${
            isDarkMode 
              ? "border-amber-500/20 bg-slate-900/90 shadow-amber-950/10" 
              : "border-amber-500/30 bg-white/95 shadow-slate-200"
          }`}>
            <div className="w-full pl-[15mm] md:pl-[calc(15mm+48px+15mm)] pr-[15mm] py-3.5 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center space-x-3.5">
                <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-amber-400 via-amber-500 to-amber-600 flex items-center justify-center shadow-lg shadow-amber-500/30 text-slate-950 font-black shrink-0">
                  <i data-lucide="calendar" className="w-6 h-6 stroke-[2.5]"></i>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl sm:text-2xl font-black tracking-tight text-amber-500 dark:text-amber-400 drop-shadow-[0_2px_10px_rgba(251,191,36,0.3)] uppercase flex items-center gap-2">
                      OFFICIAL HOLIDAY REPORT
                    </h1>
                    <span className="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-500/20 text-amber-600 dark:text-amber-300 border border-amber-500/40 uppercase tracking-widest">
                      2026 EDITION
                    </span>
                  </div>
                  <p className="text-xs text-slate-500 dark:text-slate-400 font-medium">Global Workforce Holiday Attendance & Dispatch System</p>
                </div>
              </div>

              {/* Selector de Feriado + Botones de Encabezado */}
              <div className="flex items-center flex-wrap gap-2.5">
                <div className={`flex items-center border rounded-xl px-3 py-1.5 shadow-inner ${
                  isDarkMode ? "bg-slate-950 border-amber-500/30" : "bg-slate-100 border-amber-500/40"
                }`}>
                  <i data-lucide="sparkles" className="w-4 h-4 text-amber-500 dark:text-amber-400 mr-2 shrink-0"></i>
                  <span className="text-xs text-amber-600 dark:text-amber-300/80 uppercase font-semibold mr-2 hidden sm:inline">Select Holiday:</span>
                  <select
                    value={selectedHolidayId}
                    onChange={(e) => {
                      setSelectedHolidayId(e.target.value);
                      setSelectedAgentIds(new Set());
                    }}
                    className="bg-transparent text-amber-600 dark:text-amber-400 text-xs sm:text-sm font-bold focus:outline-none cursor-pointer pr-2 max-w-[220px] sm:max-w-[280px] truncate"
                  >
                    {sortedHolidaysList.map(h => (
                      <option key={h.id} value={h.id} className="bg-slate-900 text-white py-1">
                        {h.name}
                      </option>
                    ))}
                  </select>
                </div>

                <button
                  onClick={() => setIsNewHolidayModalOpen(true)}
                  title="Add Custom Holiday"
                  className={`px-3 py-2 rounded-xl text-amber-500 dark:text-amber-400 border border-amber-500/40 text-xs font-bold flex items-center gap-1.5 transition-all active:scale-95 shadow-md ${
                    isDarkMode ? "bg-slate-800 hover:bg-slate-700" : "bg-white hover:bg-slate-100"
                  }`}
                >
                  <i data-lucide="calendar-plus" className="w-4 h-4"></i>
                  <span>Add Holiday</span>
                </button>

                {/* BOTÓN PARA REMOVER FERIADO */}
                <button
                  onClick={() => triggerMgmtProtectedAction("REMOVE_HOLIDAY", selectedHolidayId)}
                  title="Remove Current Holiday"
                  className="px-3 py-2 rounded-xl text-rose-400 hover:text-rose-300 border border-rose-500/40 bg-rose-950/40 hover:bg-rose-900/50 text-xs font-bold flex items-center gap-1.5 transition-all active:scale-95 shadow-md"
                >
                  <i data-lucide="calendar-x" className="w-4 h-4"></i>
                  <span>Remove Holiday</span>
                </button>

                <button
                  onClick={handleSaveHolidayManually}
                  className="px-3.5 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 text-xs sm:text-sm font-bold flex items-center gap-1.5 shadow-lg shadow-amber-500/20 transition-all active:scale-95"
                >
                  <i data-lucide="save" className="w-4 h-4"></i>
                  <span>Save Holiday</span>
                </button>

                <button
                  onClick={handleExportToExcel}
                  className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs sm:text-sm font-bold flex items-center gap-2 shadow-lg shadow-emerald-700/20 transition-all active:scale-95"
                >
                  <i data-lucide="file-spreadsheet" className="w-4 h-4"></i>
                  <span>Export to Excel</span>
                </button>
              </div>
            </div>
          </header>

          {/* Notificación de guardado */}
          {saveNotice && (
            <div className="bg-gradient-to-r from-amber-500 to-amber-400 text-slate-950 text-xs font-bold py-2 px-4 text-center transition-all shadow-md flex items-center justify-center gap-2">
              <i data-lucide="check-circle" className="w-4 h-4"></i>
              <span>{saveNotice}</span>
            </div>
          )}

          {/* MAIN CONTAINER */}
          <main className="flex-1 w-full pl-[15mm] md:pl-[calc(15mm+48px+15mm)] pr-[15mm] py-6 space-y-6">
            
            {/* KPI STAT CARDS */}
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3.5">
              <div className={`border rounded-2xl p-4 relative overflow-hidden backdrop-blur-sm shadow-sm ${
                isDarkMode ? "bg-slate-900/70 border-slate-800" : "bg-white border-slate-200 shadow-slate-100"
              }`}>
                <div className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                  Total in {filterCountry === "ALL" ? "All Countries" : filterCountry}
                </div>
                <div className={`text-2xl sm:text-3xl font-black mt-1 ${isDarkMode ? "text-white" : "text-slate-900"}`}>{totalStaff}</div>
                <div className="text-[11px] text-slate-400 dark:text-slate-500 mt-1">Active Roster Agents</div>
              </div>

              <div className={`border rounded-2xl p-4 relative overflow-hidden backdrop-blur-sm shadow-md ${
                isDarkMode ? "bg-slate-900/70 border-amber-500/30 shadow-amber-950/20" : "bg-amber-50/70 border-amber-300 shadow-amber-100"
              }`}>
                <div className="text-xs font-bold text-amber-600 dark:text-amber-400 uppercase tracking-wider flex items-center justify-between">
                  Required to Work
                  <span className="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                </div>
                <div className="text-2xl sm:text-3xl font-black text-amber-600 dark:text-amber-400 mt-1">{requiredCount}</div>
                <div className="text-[11px] text-amber-700/80 dark:text-amber-400/70 mt-1">
                  {totalStaff ? ((requiredCount / totalStaff) * 100).toFixed(0) : 0}% Active Coverage
                </div>
              </div>

              <div className={`border rounded-2xl p-4 relative overflow-hidden backdrop-blur-sm shadow-sm ${
                isDarkMode ? "bg-slate-900/70 border-slate-800" : "bg-white border-slate-200 shadow-slate-100"
              }`}>
                <div className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Not Required / Off</div>
                <div className={`text-2xl sm:text-3xl font-black mt-1 ${isDarkMode ? "text-slate-300" : "text-slate-700"}`}>{notRequiredCount}</div>
                <div className="text-[11px] text-slate-400 dark:text-slate-500 mt-1">Exempt / Rested</div>
              </div>

              <div className={`border rounded-2xl p-4 relative overflow-hidden backdrop-blur-sm shadow-sm ${
                isDarkMode ? "bg-slate-900/70 border-slate-800" : "bg-white border-slate-200 shadow-slate-100"
              }`}>
                <div className="text-xs font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider">Shift Completed</div>
                <div className="text-2xl sm:text-3xl font-black text-emerald-600 dark:text-emerald-400 mt-1">{completedCount}</div>
                <div className="text-[11px] text-slate-400 dark:text-slate-500 mt-1">Full shift recorded</div>
              </div>

              <div className={`border rounded-2xl p-4 relative overflow-hidden backdrop-blur-sm shadow-sm ${
                isDarkMode ? "bg-slate-900/70 border-rose-500/20" : "bg-white border-rose-200 shadow-slate-100"
              }`}>
                <div className="text-xs font-bold text-rose-600 dark:text-rose-400 uppercase tracking-wider">Exceptions</div>
                <div className="text-2xl sm:text-3xl font-black text-rose-600 dark:text-rose-400 mt-1">{exceptionsCount}</div>
                <div className="text-[11px] text-slate-400 dark:text-slate-500 mt-1">Late In or Early Out</div>
              </div>
            </div>

            {/* SECCIÓN DE FILTROS */}
            <div className={`border rounded-2xl p-4 sm:p-5 shadow-xl space-y-4 ${
              isDarkMode ? "bg-slate-900/80 border-slate-800" : "bg-white border-slate-200"
            }`}>
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
                
                {/* Selector de País con Opción ALL COUNTRIES */}
                <div className={`border rounded-xl p-2 ${
                  isDarkMode ? "bg-amber-500/10 border-amber-500/40" : "bg-amber-50/70 border-amber-300"
                }`}>
                  <label className="text-[11px] font-black text-amber-600 dark:text-amber-400 uppercase tracking-wider mb-1 flex items-center justify-between">
                    <span>Active Country</span>
                    <i data-lucide="shield-check" className="w-3.5 h-3.5 text-amber-500"></i>
                  </label>
                  <select
                    value={filterCountry}
                    onChange={handleCountrySelectChange}
                    className={`w-full rounded-lg px-2.5 py-1.5 text-xs font-bold focus:outline-none cursor-pointer border ${
                      isDarkMode 
                        ? "bg-slate-950 border-amber-500/50 text-amber-300" 
                        : "bg-white border-amber-400 text-amber-700"
                    }`}
                  >
                    <option value="ALL" className="bg-slate-900 text-amber-400 font-black">
                      ★ ALL COUNTRIES (Mgmt Required)
                    </option>
                    {COUNTRY_LIST.map(c => (
                      <option key={c} value={c} className="bg-slate-900 text-white font-medium">
                        {c}
                      </option>
                    ))}
                  </select>
                </div>

                {/* Search */}
                <div>
                  <label className="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1 block">Search Agent</label>
                  <div className="relative">
                    <input
                      type="text"
                      placeholder="Name, supervisor..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className={`w-full border rounded-xl px-3 py-2 text-xs focus:outline-none transition-all ${
                        isDarkMode 
                          ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white placeholder-slate-500" 
                          : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-900 placeholder-slate-400"
                      }`}
                    />
                    {searchTerm && (
                      <button onClick={() => setSearchTerm("")} className="absolute right-2.5 top-2 text-slate-400 hover:text-slate-600 dark:hover:text-white">✕</button>
                    )}
                  </div>
                </div>

                {/* Team Filter */}
                <div>
                  <label className="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1 block">Team</label>
                  <select
                    value={filterTeam}
                    onChange={(e) => setFilterTeam(e.target.value)}
                    className={`w-full border rounded-xl px-3 py-2 text-xs focus:outline-none ${
                      isDarkMode 
                        ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" 
                        : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-800"
                    }`}
                  >
                    {teams.map(t => (
                      <option key={t} value={t} className="bg-slate-900 text-white">{t === "ALL" ? "All Teams" : t}</option>
                    ))}
                  </select>
                </div>

                {/* Supervisor Filter */}
                <div>
                  <label className="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1 block">Supervisor</label>
                  <select
                    value={filterSupervisor}
                    onChange={(e) => setFilterSupervisor(e.target.value)}
                    className={`w-full border rounded-xl px-3 py-2 text-xs focus:outline-none ${
                      isDarkMode 
                        ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" 
                        : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-800"
                    }`}
                  >
                    {supervisors.map(s => (
                      <option key={s} value={s} className="bg-slate-900 text-white">{s === "ALL" ? "All Supervisors" : s}</option>
                    ))}
                  </select>
                </div>

                {/* Status / Comment Filter */}
                <div>
                  <label className="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1 block">Status Comment</label>
                  <select
                    value={filterComment}
                    onChange={(e) => setFilterComment(e.target.value)}
                    className={`w-full border rounded-xl px-3 py-2 text-xs focus:outline-none ${
                      isDarkMode 
                        ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" 
                        : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-800"
                    }`}
                  >
                    <option value="ALL" className="bg-slate-900 text-white">All Comments</option>
                    <option value="Shift Completed" className="bg-slate-900 text-white">Shift Completed</option>
                    <option value="Early Out at" className="bg-slate-900 text-white">Early Out at</option>
                    <option value="Late In at" className="bg-slate-900 text-white">Late In at</option>
                    <option value="Not Required to Come" className="bg-slate-900 text-white">Not Required to Come</option>
                  </select>
                </div>

              </div>

              {/* BARRA DE ACCIÓN */}
              <div className={`pt-3 border-t flex flex-wrap items-center justify-between gap-3 ${
                isDarkMode ? "border-slate-800" : "border-slate-200"
              }`}>
                <div className="flex items-start sm:items-center flex-wrap gap-2.5">
                  <div className="flex flex-col sm:flex-row gap-2">
                    <button
                      onClick={() => triggerMgmtProtectedAction("ADD_MODAL", null)}
                      className="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs uppercase tracking-wider flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20 active:scale-95 transition-all"
                    >
                      <i data-lucide="user-plus" className="w-4 h-4"></i>
                      <span>Add Agent</span>
                    </button>

                    <button
                      onClick={handleSaveTeamGlobally}
                      title="Save current team changes across all holidays"
                      className={`px-4 py-2 rounded-xl text-xs font-black uppercase tracking-wider flex items-center justify-center gap-2 border shadow-md active:scale-95 transition-all ${
                        isDarkMode
                          ? "bg-slate-800 hover:bg-slate-700 text-amber-400 border-amber-500/40 hover:border-amber-400"
                          : "bg-amber-50 hover:bg-amber-100 text-amber-700 border-amber-300"
                      }`}
                    >
                      <i data-lucide="users" className="w-4 h-4"></i>
                      <span>Save Team</span>
                    </button>
                  </div>

                  <button
                    onClick={() => {
                      runAvailabilityOptimization(targetPercentage);
                      setIsAvailabilityModalOpen(true);
                    }}
                    className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs uppercase tracking-wider flex items-center gap-2 shadow-lg shadow-indigo-600/25 active:scale-95 transition-all"
                  >
                    <i data-lucide="calculator" className="w-4 h-4"></i>
                    <span>Calculate Availability</span>
                  </button>

                  <span className="text-xs text-slate-500 dark:text-slate-400 font-medium ml-1">
                    Showing <span className="font-bold text-amber-600 dark:text-amber-400">{filteredStaff.length}</span> of {countryStaffAll.length} agents in <span className="font-bold text-slate-900 dark:text-white">{filterCountry === "ALL" ? "All Countries" : filterCountry}</span>
                  </span>
                </div>

                <div className="flex items-center gap-2">
                  <button
                    onClick={() => handleBulkRequirement(true)}
                    className={`px-2.5 py-1.5 rounded-lg text-[11px] font-bold border transition-colors ${
                      isDarkMode 
                        ? "bg-slate-800 hover:bg-slate-700 text-amber-300 border-slate-700" 
                        : "bg-amber-50 hover:bg-amber-100 text-amber-700 border-amber-200"
                    }`}
                  >
                    Mark Filtered Required
                  </button>
                  <button
                    onClick={() => handleBulkRequirement(false)}
                    className={`px-2.5 py-1.5 rounded-lg text-[11px] font-bold border transition-colors ${
                      isDarkMode 
                        ? "bg-slate-800 hover:bg-slate-700 text-slate-400 border-slate-700" 
                        : "bg-slate-100 hover:bg-slate-200 text-slate-600 border-slate-200"
                    }`}
                  >
                    Mark Filtered Not Required
                  </button>
                  {(searchTerm || filterTeam !== "ALL" || filterSupervisor !== "ALL" || filterComment !== "ALL") && (
                    <button
                      onClick={() => {
                        setSearchTerm("");
                        setFilterTeam("ALL");
                        setFilterSupervisor("ALL");
                        setFilterComment("ALL");
                      }}
                      className="px-2.5 py-1.5 rounded-lg bg-rose-950/40 hover:bg-rose-900/50 text-rose-300 border border-rose-800/40 text-[11px] font-semibold transition-colors"
                    >
                      Clear Filters
                    </button>
                  )}
                </div>
              </div>

              {/* BARRA FLOTANTE DE SELECCIÓN MÚLTIPLE */}
              {selectedAgentIds.size > 0 && (
                <div className={`p-3 rounded-xl border flex flex-wrap items-center justify-between gap-3 animate-fade-in ${
                  isDarkMode 
                    ? "bg-amber-500/10 border-amber-500/40 text-amber-300" 
                    : "bg-amber-100 border-amber-300 text-amber-900"
                }`}>
                  <div className="flex items-center gap-2">
                    <span className="w-6 h-6 rounded-lg bg-amber-500 text-slate-950 font-black text-xs flex items-center justify-center">
                      {selectedAgentIds.size}
                    </span>
                    <span className="text-xs font-bold">
                      {selectedAgentIds.size === 1 ? "1 agent selected" : `${selectedAgentIds.size} agents selected`}
                    </span>
                  </div>

                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => triggerMgmtProtectedAction("BULK_EDIT_MODAL", null)}
                      className="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold flex items-center gap-1.5 transition-colors shadow-sm"
                    >
                      <i data-lucide="edit" className="w-3.5 h-3.5"></i>
                      <span>Edit Selected</span>
                    </button>

                    <button
                      onClick={() => triggerMgmtProtectedAction("BULK_DELETE", selectedAgentIds)}
                      className="px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold flex items-center gap-1.5 transition-colors shadow-sm"
                    >
                      <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                      <span>Delete Selected</span>
                    </button>

                    <button
                      onClick={() => setSelectedAgentIds(new Set())}
                      className="px-2.5 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800/40 transition-colors"
                    >
                      Clear
                    </button>
                  </div>
                </div>
              )}

            </div>

            {/* TABLA PRINCIPAL */}
            <div className={`border rounded-2xl shadow-2xl overflow-hidden ${
              isDarkMode ? "bg-slate-900/80 border-slate-800" : "bg-white border-slate-200"
            }`}>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr className={`border-b font-bold tracking-wider uppercase text-[11px] ${
                      isDarkMode 
                        ? "bg-gradient-to-r from-slate-950 via-slate-900 to-slate-950 border-amber-500/30 text-amber-400" 
                        : "bg-slate-100 border-amber-500/40 text-amber-700"
                    }`}>
                      <th className="py-3 px-3 w-10 text-center">#</th>
                      <th className="py-3 px-4">Name</th>
                      <th className="py-3 px-3">Country</th>
                      <th className="py-3 px-3">Team</th>
                      <th className="py-3 px-3">Supervisor</th>
                      <th className={`py-3 px-3 text-center ${isDarkMode ? "bg-slate-800/40 text-amber-300" : "bg-amber-100/60 text-amber-800"}`}>Check In</th>
                      <th className={`py-3 px-3 text-center ${isDarkMode ? "bg-slate-800/40 text-amber-300" : "bg-amber-100/60 text-amber-800"}`}>Check Out</th>
                      <th className="py-3 px-3 text-center">Required to Work?</th>
                      <th className="py-3 px-4">Status & Reason/Time</th>
                      <th className={`py-3 px-3 text-center whitespace-nowrap ${isDarkMode ? "bg-indigo-950/40 text-indigo-300 border-x border-indigo-500/20" : "bg-indigo-50 text-indigo-800 border-x border-indigo-200"}`}>
                        Total Hours Worked
                      </th>
                      <th className="py-3 px-3 text-center w-28">
                        <div className="inline-flex items-center gap-1.5">
                          <input
                            type="checkbox"
                            checked={areAllFilteredSelected}
                            onChange={toggleSelectAllFiltered}
                            title="Select / Deselect all visible agents"
                            className="w-4 h-4 rounded cursor-pointer accent-amber-500"
                          />
                          <span>Actions</span>
                        </div>
                      </th>
                    </tr>
                  </thead>
                  <tbody className={`divide-y font-medium ${isDarkMode ? "divide-slate-800/70" : "divide-slate-200"}`}>
                    {filteredStaff.length === 0 ? (
                      <tr>
                        <td colSpan="11" className="py-12 text-center text-slate-500 italic">
                          No matching team members found for {filterCountry === "ALL" ? "All Countries" : filterCountry}.
                        </td>
                      </tr>
                    ) : (
                      filteredStaff.map((agent, index) => {
                        const isExempt = !agent.isRequired;
                        const isSelected = selectedAgentIds.has(agent.id);
                        const hoursInfo = calculateHoursWorked(agent);

                        return (
                          <tr
                            key={agent.id}
                            className={`transition-colors ${
                              isSelected
                                ? (isDarkMode ? "bg-amber-500/15" : "bg-amber-100/70")
                                : isDarkMode ? "hover:bg-slate-800/50" : "hover:bg-slate-50"
                            } ${
                              isExempt 
                                ? (isDarkMode ? "bg-slate-950/40 opacity-75" : "bg-slate-100/60 opacity-75") 
                                : "bg-transparent"
                            }`}
                          >
                            <td className="py-3 px-3 text-center text-slate-400 font-mono text-[11px]">
                              {index + 1}
                            </td>

                            <td className={`py-3 px-4 font-bold whitespace-nowrap ${isDarkMode ? "text-white" : "text-slate-900"}`}>
                              {agent.name}
                            </td>

                            <td className="py-3 px-3 whitespace-nowrap">
                              <span className="inline-block px-2 py-0.5 rounded-md text-[10px] font-bold tracking-wide uppercase border bg-amber-500/10 text-amber-500 dark:text-amber-400 border-amber-500/30">
                                {agent.country}
                              </span>
                            </td>

                            <td className={`py-3 px-3 font-medium whitespace-nowrap ${isDarkMode ? "text-slate-300" : "text-slate-600"}`}>
                              {agent.team}
                            </td>

                            <td className={`py-3 px-3 whitespace-nowrap ${isDarkMode ? "text-slate-300" : "text-slate-600"}`}>
                              {agent.supervisor}
                            </td>

                            <td className={`py-3 px-3 text-center font-mono text-xs whitespace-nowrap ${
                              isDarkMode ? "text-amber-300 bg-slate-900/40" : "text-amber-700 bg-amber-50/50"
                            }`}>
                              {agent.checkIn || "—"}
                            </td>
                            <td className={`py-3 px-3 text-center font-mono text-xs whitespace-nowrap ${
                              isDarkMode ? "text-amber-300 bg-slate-900/40" : "text-amber-700 bg-amber-50/50"
                            }`}>
                              {agent.checkOut || "—"}
                            </td>

                            <td className="py-3 px-3 text-center">
                              <button
                                onClick={() => updateAgentField(agent.id, "isRequired", !agent.isRequired)}
                                className={`px-2.5 py-1 rounded-full text-[10px] font-black uppercase tracking-wider border transition-all ${
                                  agent.isRequired
                                    ? "bg-amber-400 text-slate-950 border-amber-300 shadow-md shadow-amber-500/20"
                                    : (isDarkMode ? "bg-slate-800 text-slate-400 border-slate-700 hover:text-slate-200" : "bg-slate-200 text-slate-600 border-slate-300")
                                }`}
                              >
                                {agent.isRequired ? "YES • REQUIRED" : "NO • OFF"}
                              </button>
                            </td>

                            <td className="py-3 px-4">
                              <div className="flex flex-col sm:flex-row items-start sm:items-center gap-2">
                                <select
                                  value={agent.commentType}
                                  onChange={(e) => updateAgentField(agent.id, "commentType", e.target.value)}
                                  className={`rounded-lg px-2.5 py-1 text-xs font-semibold border focus:outline-none ${
                                    agent.commentType === "Shift Completed"
                                      ? (isDarkMode ? "bg-emerald-950/70 border-emerald-700/60 text-emerald-300" : "bg-emerald-50 border-emerald-300 text-emerald-800")
                                      : agent.commentType === "Early Out at" || agent.commentType === "Late In at"
                                      ? (isDarkMode ? "bg-amber-950/80 border-amber-600/70 text-amber-300" : "bg-amber-50 border-amber-300 text-amber-800")
                                      : (isDarkMode ? "bg-slate-800 border-slate-700 text-slate-300" : "bg-slate-100 border-slate-300 text-slate-700")
                                  }`}
                                >
                                  <option value="Shift Completed" className="bg-slate-900 text-white">Shift Completed</option>
                                  <option value="Early Out at" className="bg-slate-900 text-white">Early Out at</option>
                                  <option value="Late In at" className="bg-slate-900 text-white">Late In at</option>
                                  <option value="Not Required to Come" className="bg-slate-900 text-white">Not Required to Come</option>
                                </select>

                                {agent.commentType === "Not Required to Come" && (
                                  <select
                                    value={agent.commentDetail || "Holiday Rested"}
                                    onChange={(e) => updateAgentField(agent.id, "commentDetail", e.target.value)}
                                    className={`rounded-lg px-2 py-1 text-xs font-semibold border focus:outline-none ${
                                      isDarkMode 
                                        ? "bg-slate-950 border-slate-600 text-amber-400 focus:border-amber-400" 
                                        : "bg-white border-slate-300 text-amber-700 focus:border-amber-500"
                                    }`}
                                  >
                                    {NOT_REQUIRED_REASONS.map(reason => (
                                      <option key={reason} value={reason} className="bg-slate-900 text-white">
                                        {reason}
                                      </option>
                                    ))}
                                  </select>
                                )}

                                {(agent.commentType === "Early Out at" || agent.commentType === "Late In at") && (
                                  <input
                                    type="text"
                                    placeholder="e.g. 2:30 PM"
                                    value={agent.commentDetail || ""}
                                    onChange={(e) => updateAgentField(agent.id, "commentDetail", e.target.value)}
                                    className={`w-28 border rounded px-2 py-0.5 text-xs font-mono focus:outline-none ${
                                      isDarkMode 
                                        ? "bg-slate-950 border-amber-500 text-amber-300 placeholder-slate-600" 
                                        : "bg-white border-amber-400 text-amber-800 placeholder-slate-400"
                                    }`}
                                  />
                                )}
                              </div>
                            </td>

                            {/* NUEVA COLUMNA: TOTAL HOURS WORKED */}
                            <td className="py-3 px-3 text-center whitespace-nowrap">
                              <span className={`inline-flex items-center px-2.5 py-1 rounded-lg font-mono text-xs font-bold border ${
                                hoursInfo.text === "Pending Time"
                                  ? (isDarkMode ? "bg-amber-950/40 border-amber-600/40 text-amber-400" : "bg-amber-50 border-amber-300 text-amber-700")
                                  : hoursInfo.hours === 0
                                  ? (isDarkMode ? "bg-slate-800/60 border-slate-700 text-slate-400" : "bg-slate-100 border-slate-300 text-slate-600")
                                  : hoursInfo.hours >= 8
                                  ? (isDarkMode ? "bg-emerald-950/40 border-emerald-600/40 text-emerald-400" : "bg-emerald-50 border-emerald-300 text-emerald-700")
                                  : (isDarkMode ? "bg-indigo-950/50 border-indigo-500/40 text-indigo-300" : "bg-indigo-50 border-indigo-300 text-indigo-700")
                              }`}>
                                <i data-lucide="clock" className="w-3 h-3 mr-1.5 opacity-75"></i>
                                {hoursInfo.text}
                              </span>
                            </td>

                            <td className="py-3 px-3 text-center whitespace-nowrap">
                              <div className="inline-flex items-center gap-1.5">
                                <input
                                  type="checkbox"
                                  checked={isSelected}
                                  onChange={() => toggleSelectAgent(agent.id)}
                                  className="w-4 h-4 rounded cursor-pointer accent-amber-500 mr-1"
                                />

                                <button
                                  onClick={() => triggerMgmtProtectedAction("EDIT_MODAL", agent)}
                                  title="Edit Agent Information"
                                  className={`p-1.5 rounded-lg transition-colors ${
                                    isDarkMode 
                                      ? "bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-300" 
                                      : "bg-slate-200 hover:bg-amber-500 hover:text-slate-950 text-slate-700"
                                  }`}
                                >
                                  <i data-lucide="edit-3" className="w-3.5 h-3.5"></i>
                                </button>
                                <button
                                  onClick={() => triggerMgmtProtectedAction("DELETE_AGENT", agent)}
                                  title="Delete Agent from Roster"
                                  className={`p-1.5 rounded-lg transition-colors ${
                                    isDarkMode 
                                      ? "bg-slate-800 hover:bg-rose-600 hover:text-white text-slate-400" 
                                      : "bg-slate-200 hover:bg-rose-600 hover:text-white text-slate-600"
                                  }`}
                                >
                                  <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                                </button>
                              </div>
                            </td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {/* FOOTER */}
          <footer className={`border-t py-4 px-6 text-center text-xs ${
            isDarkMode ? "border-slate-800/80 text-slate-500" : "border-slate-200 text-slate-400"
          }`}>
            OFFICIAL HOLIDAY REPORT &bull; Enterprise Operations 2026 &bull; Secure Multi-Country Roster Management
          </footer>

          {/* BOTÓN FLOTANTE MODO OSCURO/CLARO */}
          <div className="fixed bottom-[15mm] left-[15mm] z-40">
            <button
              onClick={() => setIsDarkMode(prev => !prev)}
              title={isDarkMode ? "Switch to Light Mode" : "Switch to Dark Mode"}
              className={`w-12 h-12 rounded-2xl shadow-2xl flex items-center justify-center border transition-all active:scale-90 ${
                isDarkMode 
                  ? "bg-slate-900 hover:bg-slate-800 text-amber-400 border-amber-500/40 shadow-amber-950/40" 
                  : "bg-white hover:bg-slate-100 text-amber-600 border-amber-300 shadow-slate-300"
              }`}
            >
              <i data-lucide={isDarkMode ? "sun" : "moon"} className="w-5 h-5 stroke-[2.2]"></i>
            </button>
          </div>

          {/* MODAL: CALCULATE AVAILABILITY */}
          {isAvailabilityModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`border rounded-2xl max-w-xl w-full p-6 shadow-2xl relative max-h-[92vh] overflow-y-auto ${
                isDarkMode ? "bg-slate-900 border-indigo-500/50" : "bg-white border-indigo-200 text-slate-900"
              }`}>
                <div className="flex items-center justify-between border-b pb-3 mb-4 border-slate-700/60">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold">
                      <i data-lucide="cpu" className="w-5 h-5"></i>
                    </div>
                    <div>
                      <h3 className="text-base font-black uppercase tracking-wider text-indigo-400">
                        Workforce Availability Engine
                      </h3>
                      <p className="text-xs text-slate-400">Operations Window: Phones (6 AM - 7 PM) &bull; Cases (24/7)</p>
                    </div>
                  </div>
                  <button 
                    onClick={() => setIsAvailabilityModalOpen(false)} 
                    className="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-800 transition-colors text-base font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className={`p-4 rounded-xl border mb-5 ${
                  isDarkMode ? "bg-slate-950 border-slate-800" : "bg-slate-50 border-slate-200"
                }`}>
                  <label className="text-xs font-bold uppercase tracking-wider block mb-2 text-slate-400">
                    Select Target Coverage Percentage:
                  </label>
                  <div className="flex flex-wrap gap-2">
                    {[50, 60, 70, 80, 90, 100].map(pct => (
                      <button
                        key={pct}
                        type="button"
                        onClick={() => {
                          setTargetPercentage(pct);
                          runAvailabilityOptimization(pct);
                        }}
                        className={`px-3.5 py-1.5 rounded-lg text-xs font-black transition-all ${
                          targetPercentage === pct
                            ? "bg-indigo-600 text-white shadow-md shadow-indigo-600/30 scale-105"
                            : (isDarkMode ? "bg-slate-800 hover:bg-slate-700 text-slate-300" : "bg-slate-200 hover:bg-slate-300 text-slate-700")
                        }`}
                      >
                        {pct}%
                      </button>
                    ))}
                  </div>
                </div>

                {availabilityResult && (
                  <div className="space-y-4">
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                      <div className={`p-3 rounded-xl border text-center ${
                        isDarkMode ? "bg-slate-950 border-slate-800" : "bg-slate-50 border-slate-200"
                      }`}>
                        <span className="text-[10px] uppercase font-bold text-slate-400 block">Total Active</span>
                        <span className="text-xl font-black">{availabilityResult.total}</span>
                      </div>
                      <div className="p-3 rounded-xl border border-indigo-500/30 bg-indigo-500/10 text-center">
                        <span className="text-[10px] uppercase font-bold text-indigo-400 block">Recommended</span>
                        <span className="text-xl font-black text-indigo-400">{availabilityResult.recommendedCount}</span>
                      </div>
                      <div className="p-3 rounded-xl border border-emerald-500/30 bg-emerald-500/10 text-center">
                        <span className="text-[10px] uppercase font-bold text-emerald-400 block">Rested / Off</span>
                        <span className="text-xl font-black text-emerald-400">{availabilityResult.offCount}</span>
                      </div>
                      <div className="p-3 rounded-xl border border-amber-500/30 bg-amber-500/10 text-center">
                        <span className="text-[10px] uppercase font-bold text-amber-400 block">Coverage</span>
                        <span className="text-xl font-black text-amber-400">{availabilityResult.percentage}%</span>
                      </div>
                    </div>

                    <div className={`p-3.5 rounded-xl border text-xs space-y-1.5 ${
                      isDarkMode ? "bg-slate-950/70 border-slate-800" : "bg-slate-50 border-slate-200"
                    }`}>
                      <div className="font-bold uppercase tracking-wider text-[11px] text-slate-300 flex items-center gap-1.5">
                        <i data-lucide="shield" className="w-3.5 h-3.5 text-indigo-400"></i>
                        Operational Constraints Audit:
                      </div>
                      <div className="flex items-center justify-between text-[11px]">
                        <span>Phones Operation Window (6:00 AM - 7:00 PM):</span>
                        <span className={availabilityResult.covers6AM && availabilityResult.covers7PM ? "text-emerald-400 font-bold" : "text-amber-400 font-bold"}>
                          {availabilityResult.covers6AM && availabilityResult.covers7PM ? "✓ Fully Covered" : "⚠ Partial Hours Covered"}
                        </span>
                      </div>
                      <div className="flex items-center justify-between text-[11px]">
                        <span>Cases Department (24/7 Staggering):</span>
                        <span className="text-emerald-400 font-bold">
                          ✓ {availabilityResult.caseAgentsCount} Agents Staggered
                        </span>
                      </div>
                      <div className="flex items-center justify-between text-[11px]">
                        <span>Active Management on Duty:</span>
                        <span className="text-indigo-400 font-bold">{availabilityResult.managementCount} Assigned</span>
                      </div>
                    </div>

                    <div>
                      <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">
                        Recommended Shift Schedule Breakdown:
                      </h4>
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
                        {Object.entries(availabilityResult.scheduleBreakdown).map(([shift, count]) => (
                          <div key={shift} className={`p-2 rounded-lg border flex items-center justify-between ${
                            isDarkMode ? "bg-slate-950 border-slate-800 text-slate-300" : "bg-slate-100 border-slate-200 text-slate-700"
                          }`}>
                            <span className="font-mono text-[11px]">{shift}</span>
                            <span className="font-black px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-400">{count}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL: EDIT AGENTS IN BULK */}
          {isBulkEditModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`border rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto ${
                isDarkMode ? "bg-slate-900 border-amber-500/50" : "bg-white border-amber-400 text-slate-900"
              }`}>
                <div className={`flex items-center justify-between border-b pb-3 mb-4 ${isDarkMode ? "border-slate-800" : "border-slate-200"}`}>
                  <div>
                    <h3 className="text-base font-bold text-amber-500 dark:text-amber-400 uppercase tracking-wider flex items-center gap-2">
                      <i data-lucide="edit-3" className="w-4 h-4"></i>
                      Edit Selected Agents ({selectedAgentIds.size})
                    </h3>
                    <p className="text-[11px] text-slate-400">Leave fields empty if you do not wish to modify them.</p>
                  </div>
                  <button onClick={() => setIsBulkEditModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleSaveBulkEditForm} className="space-y-3.5 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Team / Department</label>
                      <input
                        type="text"
                        placeholder="(Keep current)"
                        value={bulkEditFields.team}
                        onChange={(e) => setBulkEditFields({ ...bulkEditFields, team: e.target.value })}
                        className={`w-full border rounded-xl px-3 py-2 focus:outline-none ${
                          isDarkMode ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-900"
                        }`}
                      />
                    </div>

                    <div>
                      <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Direct Supervisor</label>
                      <input
                        type="text"
                        placeholder="(Keep current)"
                        value={bulkEditFields.supervisor}
                        onChange={(e) => setBulkEditFields({ ...bulkEditFields, supervisor: e.target.value })}
                        className={`w-full border rounded-xl px-3 py-2 focus:outline-none ${
                          isDarkMode ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-900"
                        }`}
                      />
                    </div>
