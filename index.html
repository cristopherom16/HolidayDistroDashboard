    // --- MOTOR DE ALMACENAMIENTO ILIMITADO (IndexedDB) ---
    const DB_NAME = "HolidayReportsDB";
    const DB_VERSION = 1;
    const STORE_NAME = "app_data";

    const idb = {
      open() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME);
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      },
      async get(key) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readonly");
          const store = tx.objectStore(STORE_NAME);
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      },
      async set(key, val) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readwrite");
          const store = tx.objectStore(STORE_NAME);
          const req = store.put(val, key);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }
    };

    function App() {
      const [holidaysList, setHolidaysList] = useState(DEFAULT_US_HOLIDAYS_2026);
      const [selectedHolidayId, setSelectedHolidayId] = useState("labor");
      const [holidaysData, setHolidaysData] = useState({ "labor": INITIAL_ROSTER });
      const [saveNotice, setSaveNotice] = useState(false);

      // Cargar datos desde IndexedDB (o migrar desde localStorage automáticamente)
      useEffect(() => {
        async function loadStoredData() {
          try {
            let list = await idb.get("OFFICIAL_HOLIDAYS_CATALOG");
            let data = await idb.get("OFFICIAL_HOLIDAY_REPORTS_V4");

            // Si aún no está en IndexedDB, intentar migrar los datos previos de localStorage
            if (!list) {
              const oldList = localStorage.getItem("OFFICIAL_HOLIDAYS_CATALOG");
              if (oldList) {
                list = JSON.parse(oldList);
                await idb.set("OFFICIAL_HOLIDAYS_CATALOG", list);
              }
            }
            if (!data) {
              const oldData = localStorage.getItem("OFFICIAL_HOLIDAY_REPORTS_V4");
              if (oldData) {
                data = JSON.parse(oldData);
                await idb.set("OFFICIAL_HOLIDAY_REPORTS_V4", data);
              }
            }

            if (list) setHolidaysList(list);
            if (data) setHolidaysData(data);
          } catch (e) {
            console.error("IndexedDB initial load error:", e);
          }
        }
        loadStoredData();
      }, []);

      // Modal para nuevo Holiday
      const [isNewHolidayModalOpen, setIsNewHolidayModalOpen] = useState(false);
      const [newHolidayName, setNewHolidayName] = useState("");
      const [newHolidayDate, setNewHolidayDate] = useState("");

      const staff = useMemo(() => {
        return holidaysData[selectedHolidayId] || INITIAL_ROSTER;
      }, [holidaysData, selectedHolidayId]);

      const setStaff = (updater) => {
        setHolidaysData(prev => {
          const currentList = prev[selectedHolidayId] || INITIAL_ROSTER;
          const nextList = typeof updater === "function" ? updater(currentList) : updater;
          const updatedState = { ...prev, [selectedHolidayId]: nextList };
          // Guardar automáticamente sin límite de espacio
          idb.set("OFFICIAL_HOLIDAY_REPORTS_V4", updatedState).catch(err => {
            console.error("Auto-save error to IndexedDB:", err);
          });
          return updatedState;
        });
      };

      const handleSaveHolidayManually = async () => {
        try {
          await idb.set("OFFICIAL_HOLIDAY_REPORTS_V4", holidaysData);
          await idb.set("OFFICIAL_HOLIDAYS_CATALOG", holidaysList);
          setSaveNotice(true);
          setTimeout(() => setSaveNotice(false), 3000);
        } catch (e) {
          alert("Error saving: " + e.message);
        }
      };

      // Crear nuevo holiday
      const handleCreateHoliday = async (e) => {
        e.preventDefault();
        if (!newHolidayName.trim()) {
          alert("Holiday name is required.");
          return;
        }

        const formattedLabel = newHolidayDate.trim()
          ? `${newHolidayName.trim()} (${newHolidayDate.trim()})`
          : newHolidayName.trim();

        const newId = "holiday-" + Date.now();
        const updatedList = [...holidaysList, { id: newId, name: formattedLabel }];
        setHolidaysList(updatedList);
        await idb.set("OFFICIAL_HOLIDAYS_CATALOG", updatedList);

        const updatedData = { ...holidaysData, [newId]: INITIAL_ROSTER };
        setHolidaysData(updatedData);
        await idb.set("OFFICIAL_HOLIDAY_REPORTS_V4", updatedData);

        setSelectedHolidayId(newId);
        setNewHolidayName("");
        setNewHolidayDate("");
        setIsNewHolidayModalOpen(false);
      };

      // Filtros
      const [filterCountry, setFilterCountry] = useState("Guatemala");
      const [searchTerm, setSearchTerm] = useState("");
      const [filterTeam, setFilterTeam] = useState("ALL");
      const [filterSupervisor, setFilterSupervisor] = useState("ALL");
      const [filterRequirement, setFilterRequirement] = useState("ALL");
      const [filterComment, setFilterComment] = useState("ALL");

      // Modales de autorización
      const [isCountryAuthOpen, setIsCountryAuthOpen] = useState(false);
      const [targetCountry, setTargetCountry] = useState("");
      const [countryPasswordInput, setCountryPasswordInput] = useState("");
      const [countryAuthError, setCountryAuthError] = useState("");

      const [isMgmtAuthModalOpen, setIsMgmtAuthModalOpen] = useState(false);
      const [mgmtActionPayload, setMgmtActionPayload] = useState(null);
      const [mgmtPasswordInput, setMgmtPasswordInput] = useState("");
      const [mgmtAuthError, setMgmtAuthError] = useState("");

      const [isAgentModalOpen, setIsAgentModalOpen] = useState(false);
      const [modalMode, setModalMode] = useState("add");
      const [currentAgentData, setCurrentAgentData] = useState({
        id: "",
        name: "",
        country: "Guatemala",
        team: "Management",
        supervisor: "Jorge Garrido",
        checkIn: "07:00:00 AM",
        checkOut: "04:00:00 PM",
        isRequired: true,
        commentType: "Shift Completed",
        commentDetail: ""
      });

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const handleCountrySelectChange = (e) => {
        const selected = e.target.value;
        if (selected === filterCountry) return;

        setTargetCountry(selected);
        setCountryPasswordInput("");
        setCountryAuthError("");
        setIsCountryAuthOpen(true);
      };

      const handleVerifyCountryPassword = (e) => {
        e?.preventDefault();
        const requiredPass = COUNTRY_PASSWORDS[targetCountry];
        if (countryPasswordInput === requiredPass) {
          setFilterCountry(targetCountry);
          setIsCountryAuthOpen(false);
        } else {
          setCountryAuthError(`Incorrect password for ${targetCountry}. Access denied.`);
        }
      };

      const teams = useMemo(() => {
        const countryStaff = staff.filter(s => s.country === filterCountry);
        return ["ALL", ...new Set(countryStaff.map(s => s.team))].sort();
      }, [staff, filterCountry]);

      const supervisors = useMemo(() => {
        const countryStaff = staff.filter(s => s.country === filterCountry);
        return ["ALL", ...new Set(countryStaff.map(s => s.supervisor))].sort();
      }, [staff, filterCountry]);

      const countryStaffAll = useMemo(() => staff.filter(s => s.country === filterCountry), [staff, filterCountry]);
      const totalStaff = countryStaffAll.length;
      const requiredCount = countryStaffAll.filter(s => s.isRequired).length;
      const notRequiredCount = totalStaff - requiredCount;
      const completedCount = countryStaffAll.filter(s => s.commentType === "Shift Completed").length;
      const exceptionsCount = countryStaffAll.filter(s => s.commentType === "Early Out at" || s.commentType === "Late In at").length;

      const filteredStaff = useMemo(() => {
        return staff.filter(agent => {
          if (agent.country !== filterCountry) return false;

          const matchSearch =
            agent.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            agent.supervisor.toLowerCase().includes(searchTerm.toLowerCase()) ||
            agent.team.toLowerCase().includes(searchTerm.toLowerCase());
          const matchTeam = filterTeam === "ALL" || agent.team === filterTeam;
          const matchSupervisor = filterSupervisor === "ALL" || agent.supervisor === filterSupervisor;
          const matchReq =
            filterRequirement === "ALL"
              ? true
              : filterRequirement === "REQUIRED"
              ? agent.isRequired
              : !agent.isRequired;
          const matchComment = filterComment === "ALL" || agent.commentType === filterComment;

          return matchSearch && matchTeam && matchSupervisor && matchReq && matchComment;
        });
      }, [staff, filterCountry, searchTerm, filterTeam, filterSupervisor, filterRequirement, filterComment]);

      const triggerMgmtProtectedAction = (actionType, payload) => {
        setMgmtActionPayload({ type: actionType, payload });
        setMgmtPasswordInput("");
        setMgmtAuthError("");
        setIsMgmtAuthModalOpen(true);
      };

      const handleVerifyMgmtPassword = (e) => {
        e?.preventDefault();
        if (mgmtPasswordInput === MANAGEMENT_AUTH_PASSWORD) {
          setIsMgmtAuthModalOpen(false);
          const { type, payload } = mgmtActionPayload;

          if (type === "ADD_MODAL") {
            setModalMode("add");
            setCurrentAgentData({
              id: "EMP-" + Date.now().toString().slice(-4),
              name: "",
              country: filterCountry,
              team: teams[1] || "Management",
              supervisor: supervisors[1] || "",
              checkIn: "07:00:00 AM",
              checkOut: "04:00:00 PM",
              isRequired: true,
              commentType: "Shift Completed",
              commentDetail: ""
            });
            setIsAgentModalOpen(true);
          } else if (type === "EDIT_MODAL") {
            setModalMode("edit");
            setCurrentAgentData({ ...payload });
            setIsAgentModalOpen(true);
          } else if (type === "DELETE_AGENT") {
            setStaff(prev => prev.filter(a => a.id !== payload.id));
          }
        } else {
          setMgmtAuthError("Invalid management password. Access denied.");
        }
      };

      const handleSaveAgentForm = (e) => {
        e.preventDefault();
        if (!currentAgentData.name.trim()) {
          alert("Agent Name is required.");
          return;
        }

        if (modalMode === "add") {
          setStaff(prev => [currentAgentData, ...prev]);
        } else {
          setStaff(prev => prev.map(a => a.id === currentAgentData.id ? currentAgentData : a));
        }
        setIsAgentModalOpen(false);
      };

      const updateAgentField = (id, field, value) => {
        setStaff(prev =>
          prev.map(agent => {
            if (agent.id === id) {
              const updated = { ...agent, [field]: value };
              if (field === "commentType") {
                if (value === "Not Required to Come") {
                  updated.isRequired = false;
                  if (!NOT_REQUIRED_REASONS.includes(updated.commentDetail)) {
                    updated.commentDetail = "Holiday Rested";
                  }
                } else if (value === "Shift Completed") {
                  updated.isRequired = true;
                  updated.commentDetail = "";
                } else {
                  updated.isRequired = true;
                  if (NOT_REQUIRED_REASONS.includes(updated.commentDetail)) {
                    updated.commentDetail = "";
                  }
                }
              }
              return updated;
            }
            return agent;
          })
        );
      };

      const handleBulkRequirement = (status) => {
        const idsToUpdate = new Set(filteredStaff.map(s => s.id));
        setStaff(prev =>
          prev.map(agent =>
            idsToUpdate.has(agent.id)
              ? {
                  ...agent,
                  isRequired: status,
                  commentType: status ? (agent.commentType === "Not Required to Come" ? "Shift Completed" : agent.commentType) : "Not Required to Come",
                  commentDetail: status ? "" : "Holiday Rested"
                }
              : agent
          )
        );
      };

      const handleExportToExcel = () => {
        const holidayObj = holidaysList.find(h => h.id === selectedHolidayId);
        const exportData = filteredStaff.map((agent, index) => {
          let detailLabel = agent.commentDetail || "N/A";
          let fullStatus = agent.commentType;
          if (agent.commentType === "Not Required to Come") {
            fullStatus = `Not Required to Come (${agent.commentDetail || "Holiday Rested"})`;
          } else if (agent.commentType === "Early Out at" || agent.commentType === "Late In at") {
            fullStatus = `${agent.commentType} ${agent.commentDetail || "Time Unspecified"}`;
          }

          return {
            "No.": index + 1,
            "Full Name": agent.name,
            "Country": agent.country,
            "Team": agent.team,
            "Direct Supervisor": agent.supervisor,
            "Check In": agent.checkIn,
            "Check Out": agent.checkOut,
            "Required to Work": agent.isRequired ? "YES" : "NO",
            "Main Status": agent.commentType,
            "Status Detail / Reason": detailLabel,
            "Full Status Summary": fullStatus,
            "Official Holiday": holidayObj?.name || selectedHolidayId
          };
        });

        const worksheet = XLSX.utils.json_to_sheet(exportData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, `${filterCountry} Roster`);

        const colWidths = [
          { wch: 6 },
          { wch: 32 },
          { wch: 15 },
          { wch: 22 },
          { wch: 22 },
          { wch: 16 },
          { wch: 16 },
          { wch: 18 },
          { wch: 22 },
          { wch: 22 },
          { wch: 38 },
          { wch: 38 }
        ];
        worksheet["!cols"] = colWidths;

        const holidaySlug = (holidayObj?.name || selectedHolidayId).replace(/[^a-zA-Z0-9]/g, "_");
        XLSX.writeFile(workbook, `OFFICIAL_HOLIDAY_REPORT_${filterCountry}_${holidaySlug}.xlsx`);
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
          {/* HEADER PRINCIPAL */}
          <header className="border-b border-amber-500/20 bg-slate-900/90 backdrop-blur-md sticky top-0 z-30 shadow-xl shadow-amber-950/10">
            <div className="max-w-[1720px] mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center space-x-3.5">
                <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-amber-400 via-amber-500 to-amber-600 flex items-center justify-center shadow-lg shadow-amber-500/30 text-slate-950 font-black">
                  <i data-lucide="calendar" className="w-6 h-6 stroke-[2.5]"></i>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl sm:text-2xl font-black tracking-tight text-amber-400 drop-shadow-[0_2px_10px_rgba(251,191,36,0.3)] uppercase flex items-center gap-2">
                      OFFICIAL HOLIDAY REPORT
                    </h1>
                    <span className="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 uppercase tracking-widest">
                      2026 EDITION
                    </span>
                  </div>
                  <p className="text-xs text-slate-400 font-medium">Global Workforce Holiday Attendance & Dispatch System</p>
                </div>
              </div>

              {/* Selector de Feriado + Botón de Agregar Nuevo Feriado */}
              <div className="flex items-center flex-wrap gap-2.5">
                <div className="flex items-center bg-slate-950 border border-amber-500/30 rounded-xl px-3 py-1.5 shadow-inner">
                  <i data-lucide="sparkles" className="w-4 h-4 text-amber-400 mr-2 shrink-0"></i>
                  <span className="text-xs text-amber-300/80 uppercase font-semibold mr-2 hidden sm:inline">Select Holiday:</span>
                  <select
                    value={selectedHolidayId}
                    onChange={(e) => setSelectedHolidayId(e.target.value)}
                    className="bg-transparent text-amber-400 text-xs sm:text-sm font-bold focus:outline-none cursor-pointer pr-2 max-w-[220px] sm:max-w-[280px] truncate"
                  >
                    {holidaysList.map(h => (
                      <option key={h.id} value={h.id} className="bg-slate-900 text-white py-1">
                        {h.name}
                      </option>
                    ))}
                  </select>
                </div>

                <button
                  onClick={() => setIsNewHolidayModalOpen(true)}
                  title="Add Custom Holiday"
                  className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/40 text-xs font-bold flex items-center gap-1.5 transition-all active:scale-95 shadow-md"
                >
                  <i data-lucide="calendar-plus" className="w-4 h-4"></i>
                  <span>Add Holiday</span>
                </button>

                <button
                  onClick={handleSaveHolidayManually}
                  className="px-3.5 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 text-xs sm:text-sm font-bold flex items-center gap-1.5 shadow-lg shadow-amber-500/20 transition-all active:scale-95"
                >
                  <i data-lucide="save" className="w-4 h-4"></i>
                  <span>Save Holiday</span>
                </button>

                <button
                  onClick={handleExportToExcel}
                  className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs sm:text-sm font-bold flex items-center gap-2 shadow-lg shadow-emerald-700/20 transition-all active:scale-95"
                >
                  <i data-lucide="file-spreadsheet" className="w-4 h-4"></i>
                  <span>Export to Excel</span>
                </button>
              </div>
            </div>
          </header>

          {/* Notificación de guardado */}
          {saveNotice && (
            <div className="bg-amber-500 text-slate-950 text-xs font-bold py-1.5 px-4 text-center transition-all animate-pulse">
              ✓ Holiday Report Data saved successfully to persistent storage!
            </div>
          )}

          {/* MAIN CONTAINER */}
          <main className="flex-1 max-w-[1720px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            
            {/* KPI STAT CARDS */}
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3.5">
              <div className="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 relative overflow-hidden backdrop-blur-sm">
                <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">Total in {filterCountry}</div>
                <div className="text-2xl sm:text-3xl font-black text-white mt-1">{totalStaff}</div>
                <div className="text-[11px] text-slate-500 mt-1">Active Roster Agents</div>
              </div>

              <div className="bg-slate-900/70 border border-amber-500/30 rounded-2xl p-4 relative overflow-hidden backdrop-blur-sm shadow-md shadow-amber-950/20">
                <div className="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center justify-between">
                  Required to Work
                  <span className="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
                </div>
                <div className="text-2xl sm:text-3xl font-black text-amber-400 mt-1">{requiredCount}</div>
                <div className="text-[11px] text-amber-400/70 mt-1">
                  {totalStaff ? ((requiredCount / totalStaff) * 100).toFixed(0) : 0}% Active Coverage
                </div>
              </div>

              <div className="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 relative overflow-hidden backdrop-blur-sm">
                <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">Not Required / Off</div>
                <div className="text-2xl sm:text-3xl font-black text-slate-300 mt-1">{notRequiredCount}</div>
                <div className="text-[11px] text-slate-500 mt-1">Exempt / Rested</div>
              </div>

              <div className="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 relative overflow-hidden backdrop-blur-sm">
                <div className="text-xs font-bold text-emerald-400 uppercase tracking-wider">Shift Completed</div>
                <div className="text-2xl sm:text-3xl font-black text-emerald-400 mt-1">{completedCount}</div>
                <div className="text-[11px] text-slate-500 mt-1">Full shift recorded</div>
              </div>

              <div className="bg-slate-900/70 border border-rose-500/20 rounded-2xl p-4 relative overflow-hidden backdrop-blur-sm">
                <div className="text-xs font-bold text-rose-400 uppercase tracking-wider">Exceptions</div>
                <div className="text-2xl sm:text-3xl font-black text-rose-400 mt-1">{exceptionsCount}</div>
                <div className="text-[11px] text-slate-500 mt-1">Late In or Early Out</div>
              </div>
            </div>

            {/* SECCIÓN DE FILTROS */}
            <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
                
                {/* Selector de País con Contraseña */}
                <div className="bg-amber-500/10 border border-amber-500/40 rounded-xl p-2">
                  <label className="text-[11px] font-black text-amber-400 uppercase tracking-wider mb-1 flex items-center justify-between">
                    <span>Active Country</span>
                    <i data-lucide="shield-check" className="w-3.5 h-3.5 text-amber-400"></i>
                  </label>
                  <select
                    value={filterCountry}
                    onChange={handleCountrySelectChange}
                    className="w-full bg-slate-950 border border-amber-500/50 rounded-lg px-2.5 py-1.5 text-xs text-amber-300 font-bold focus:outline-none cursor-pointer"
                  >
                    {COUNTRY_LIST.map(c => (
                      <option key={c} value={c} className="bg-slate-900 text-white font-medium">
                        {c}
                      </option>
                    ))}
                  </select>
                </div>

                {/* Search */}
                <div>
                  <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">Search Agent</label>
                  <div className="relative">
                    <input
                      type="text"
                      placeholder="Name, supervisor..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none transition-all"
                    />
                    {searchTerm && (
                      <button onClick={() => setSearchTerm("")} className="absolute right-2.5 top-2 text-slate-500 hover:text-white">✕</button>
                    )}
                  </div>
                </div>

                {/* Team Filter */}
                <div>
                  <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">Team</label>
                  <select
                    value={filterTeam}
                    onChange={(e) => setFilterTeam(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                  >
                    {teams.map(t => (
                      <option key={t} value={t}>{t === "ALL" ? "All Teams" : t}</option>
                    ))}
                  </select>
                </div>

                {/* Supervisor Filter */}
                <div>
                  <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">Supervisor</label>
                  <select
                    value={filterSupervisor}
                    onChange={(e) => setFilterSupervisor(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                  >
                    {supervisors.map(s => (
                      <option key={s} value={s}>{s === "ALL" ? "All Supervisors" : s}</option>
                    ))}
                  </select>
                </div>

                {/* Status / Comment Filter */}
                <div>
                  <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">Status Comment</label>
                  <select
                    value={filterComment}
                    onChange={(e) => setFilterComment(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                  >
                    <option value="ALL">All Comments</option>
                    <option value="Shift Completed">Shift Completed</option>
                    <option value="Early Out at">Early Out at</option>
                    <option value="Late In at">Late In at</option>
                    <option value="Not Required to Come">Not Required to Come</option>
                  </select>
                </div>

              </div>

              {/* BARRA: ADD AGENT & BULK */}
              <div className="pt-3 border-t border-slate-800 flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <button
                    onClick={() => triggerMgmtProtectedAction("ADD_MODAL", null)}
                    className="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs uppercase tracking-wider flex items-center gap-2 shadow-lg shadow-amber-500/20 active:scale-95 transition-all"
                  >
                    <i data-lucide="user-plus" className="w-4 h-4"></i>
                    <span>Add Agent</span>
                  </button>

                  <span className="text-xs text-slate-400 font-medium">
                    Showing <span className="font-bold text-amber-400">{filteredStaff.length}</span> of {countryStaffAll.length} agents in <span className="text-white font-bold">{filterCountry}</span>
                  </span>
                </div>

                <div className="flex items-center gap-2">
                  <button
                    onClick={() => handleBulkRequirement(true)}
                    className="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] font-bold text-amber-300 border border-slate-700 transition-colors"
                  >
                    Mark Filtered Required
                  </button>
                  <button
                    onClick={() => handleBulkRequirement(false)}
                    className="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] font-bold text-slate-400 border border-slate-700 transition-colors"
                  >
                    Mark Filtered Not Required
                  </button>
                  {(searchTerm || filterTeam !== "ALL" || filterSupervisor !== "ALL" || filterComment !== "ALL") && (
                    <button
                      onClick={() => {
                        setSearchTerm("");
                        setFilterTeam("ALL");
                        setFilterSupervisor("ALL");
                        setFilterComment("ALL");
                      }}
                      className="px-2.5 py-1.5 rounded-lg bg-rose-950/40 hover:bg-rose-900/50 text-rose-300 border border-rose-800/40 text-[11px] font-semibold transition-colors"
                    >
                      Clear Filters
                    </button>
                  )}
                </div>
              </div>
            </div>

            {/* TABLA PRINCIPAL */}
            <div className="bg-slate-900/80 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr className="bg-gradient-to-r from-slate-950 via-slate-900 to-slate-950 border-b border-amber-500/30 text-amber-400 font-bold tracking-wider uppercase text-[11px]">
                      <th className="py-3 px-3 w-12 text-center">#</th>
                      <th className="py-3 px-4">Name</th>
                      <th className="py-3 px-3">Country</th>
                      <th className="py-3 px-3">Team</th>
                      <th className="py-3 px-3">Supervisor</th>
                      <th className="py-3 px-3 text-center bg-slate-800/40 text-amber-300">Check In</th>
                      <th className="py-3 px-3 text-center bg-slate-800/40 text-amber-300">Check Out</th>
                      <th className="py-3 px-3 text-center">Required to Work?</th>
                      <th className="py-3 px-4">Status & Reason/Time</th>
                      <th className="py-3 px-3 text-center w-24">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/70 font-medium">
                    {filteredStaff.length === 0 ? (
                      <tr>
                        <td colSpan="10" className="py-12 text-center text-slate-500 italic">
                          No matching team members found for {filterCountry}.
                        </td>
                      </tr>
                    ) : (
                      filteredStaff.map((agent, index) => {
                        const isExempt = !agent.isRequired;
                        return (
                          <tr
                            key={agent.id}
                            className={`transition-colors hover:bg-slate-800/50 ${
                              isExempt ? "bg-slate-950/40 opacity-75" : "bg-transparent"
                            }`}
                          >
                            <td className="py-3 px-3 text-center text-slate-500 font-mono text-[11px]">
                              {index + 1}
                            </td>

                            <td className="py-3 px-4 text-white font-bold whitespace-nowrap">
                              {agent.name}
                            </td>

                            <td className="py-3 px-3 whitespace-nowrap">
                              <span className="inline-block px-2 py-0.5 rounded-md text-[10px] font-bold tracking-wide uppercase border bg-amber-500/10 text-amber-400 border-amber-500/30">
                                {agent.country}
                              </span>
                            </td>

                            <td className="py-3 px-3 text-slate-300 font-medium whitespace-nowrap">
                              {agent.team}
                            </td>

                            <td className="py-3 px-3 text-slate-300 whitespace-nowrap">
                              {agent.supervisor}
                            </td>

                            <td className="py-3 px-3 text-center font-mono text-xs text-amber-300 bg-slate-900/40 whitespace-nowrap">
                              {agent.checkIn || "—"}
                            </td>
                            <td className="py-3 px-3 text-center font-mono text-xs text-amber-300 bg-slate-900/40 whitespace-nowrap">
                              {agent.checkOut || "—"}
                            </td>

                            <td className="py-3 px-3 text-center">
                              <button
                                onClick={() => updateAgentField(agent.id, "isRequired", !agent.isRequired)}
                                className={`px-2.5 py-1 rounded-full text-[10px] font-black uppercase tracking-wider border transition-all ${
                                  agent.isRequired
                                    ? "bg-amber-400 text-slate-950 border-amber-300 shadow-md shadow-amber-500/20"
                                    : "bg-slate-800 text-slate-400 border-slate-700 hover:text-slate-200"
                                }`}
                              >
                                {agent.isRequired ? "YES • REQUIRED" : "NO • OFF"}
                              </button>
                            </td>

                            <td className="py-3 px-4">
                              <div className="flex flex-col sm:flex-row items-start sm:items-center gap-2">
                                <select
                                  value={agent.commentType}
                                  onChange={(e) => updateAgentField(agent.id, "commentType", e.target.value)}
                                  className={`rounded-lg px-2.5 py-1 text-xs font-semibold border focus:outline-none ${
                                    agent.commentType === "Shift Completed"
                                      ? "bg-emerald-950/70 border-emerald-700/60 text-emerald-300"
                                      : agent.commentType === "Early Out at" || agent.commentType === "Late In at"
                                      ? "bg-amber-950/80 border-amber-600/70 text-amber-300"
                                      : "bg-slate-800 border-slate-700 text-slate-300"
                                  }`}
                                >
                                  <option value="Shift Completed">Shift Completed</option>
                                  <option value="Early Out at">Early Out at</option>
                                  <option value="Late In at">Late In at</option>
                                  <option value="Not Required to Come">Not Required to Come</option>
                                </select>

                                {agent.commentType === "Not Required to Come" && (
                                  <select
                                    value={agent.commentDetail || "Holiday Rested"}
                                    onChange={(e) => updateAgentField(agent.id, "commentDetail", e.target.value)}
                                    className="bg-slate-950 border border-slate-600 rounded-lg px-2 py-1 text-xs text-amber-400 font-semibold focus:outline-none focus:border-amber-400"
                                  >
                                    {NOT_REQUIRED_REASONS.map(reason => (
                                      <option key={reason} value={reason} className="bg-slate-900 text-white">
                                        {reason}
                                      </option>
                                    ))}
                                  </select>
                                )}

                                {(agent.commentType === "Early Out at" || agent.commentType === "Late In at") && (
                                  <input
                                    type="text"
                                    placeholder="e.g. 2:30 PM"
                                    value={agent.commentDetail || ""}
                                    onChange={(e) => updateAgentField(agent.id, "commentDetail", e.target.value)}
                                    className="w-24 bg-slate-950 border border-amber-500 rounded px-2 py-0.5 text-xs text-amber-300 font-mono focus:outline-none"
                                  />
                                )}
                              </div>
                            </td>

                            <td className="py-3 px-3 text-center whitespace-nowrap">
                              <div className="inline-flex items-center gap-1.5">
                                <button
                                  onClick={() => triggerMgmtProtectedAction("EDIT_MODAL", agent)}
                                  title="Edit Agent Information"
                                  className="p-1.5 rounded-lg bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-300 transition-colors"
                                >
                                  <i data-lucide="edit-3" className="w-3.5 h-3.5"></i>
                                </button>
                                <button
                                  onClick={() => triggerMgmtProtectedAction("DELETE_AGENT", agent)}
                                  title="Delete Agent from Roster"
                                  className="p-1.5 rounded-lg bg-slate-800 hover:bg-rose-600 hover:text-white text-slate-400 transition-colors"
                                >
                                  <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                                </button>
                              </div>
                            </td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {/* FOOTER */}
          <footer className="border-t border-slate-800/80 py-4 px-6 text-center text-xs text-slate-500">
            OFFICIAL HOLIDAY REPORT &bull; Enterprise Operations 2026 &bull; Secure Multi-Country Roster Management
          </footer>

          {/* MODAL: AGREGAR NUEVO HOLIDAY */}
          {isNewHolidayModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-amber-500/50 rounded-2xl max-w-sm w-full p-6 shadow-2xl relative">
                <div className="w-12 h-12 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 mx-auto mb-3">
                  <i data-lucide="calendar-plus" className="w-6 h-6"></i>
                </div>
                <h3 className="text-center text-base font-bold text-white uppercase tracking-wider">
                  Add New Holiday
                </h3>
                <p className="text-center text-xs text-slate-400 mt-1">
                  Create a new holiday to manage its attendance independently.
                </p>

                <form onSubmit={handleCreateHoliday} className="mt-4 space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Holiday Name</label>
                    <input
                      type="text"
                      placeholder="e.g. Good Friday, Local Holiday"
                      required
                      value={newHolidayName}
                      onChange={(e) => setNewHolidayName(e.target.value)}
                      autoFocus
                      className="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2 text-white placeholder-slate-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Date (Optional label)</label>
                    <input
                      type="text"
                      placeholder="e.g. Apr 3, 2026"
                      value={newHolidayDate}
                      onChange={(e) => setNewHolidayDate(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2 text-white placeholder-slate-500 focus:outline-none"
                    />
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsNewHolidayModalOpen(false)}
                      className="flex-1 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 transition-colors"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-xs font-bold text-slate-950 transition-colors shadow-lg shadow-amber-500/20"
                    >
                      Create
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: CAMBIO DE PAÍS */}
          {isCountryAuthOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-amber-500/50 rounded-2xl max-w-sm w-full p-6 shadow-2xl relative">
                <div className="w-12 h-12 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 mx-auto mb-3">
                  <i data-lucide="key" className="w-6 h-6"></i>
                </div>
                <h3 className="text-center text-base font-bold text-white uppercase tracking-wider">
                  Access Authorization
                </h3>
                <p className="text-center text-xs text-slate-400 mt-1">
                  Enter password to access <span className="font-bold text-amber-400">{targetCountry}</span> team roster.
                </p>

                <form onSubmit={handleVerifyCountryPassword} className="mt-4 space-y-3">
                  <div>
                    <input
                      type="password"
                      placeholder={`Enter password for ${targetCountry}`}
                      value={countryPasswordInput}
                      onChange={(e) => {
                        setCountryPasswordInput(e.target.value);
                        setCountryAuthError("");
                      }}
                      autoFocus
                      className="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none font-mono"
                    />
                    {countryAuthError && (
                      <p className="text-rose-400 text-[11px] font-semibold mt-1.5 text-center">
                        {countryAuthError}
                      </p>
                    )}
                  </div>

                  <div className="flex gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setIsCountryAuthOpen(false)}
                      className="flex-1 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 transition-colors"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-xs font-bold text-slate-950 transition-colors shadow-lg shadow-amber-500/20"
                    >
                      Unlock Country
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: AUTH MANAGEMENT */}
          {isMgmtAuthModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-amber-500/40 rounded-2xl max-w-sm w-full p-6 shadow-2xl relative">
                <div className="w-12 h-12 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 mx-auto mb-3">
                  <i data-lucide="lock" className="w-6 h-6"></i>
                </div>
                <h3 className="text-center text-base font-bold text-white uppercase tracking-wider">
                  Management Authentication
                </h3>
                <p className="text-center text-xs text-slate-400 mt-1">
                  Enter authorized credentials to modify agent roster data.
                </p>

                <form onSubmit={handleVerifyMgmtPassword} className="mt-4 space-y-3">
                  <div>
                    <input
                      type="password"
                      placeholder="Enter management password"
                      value={mgmtPasswordInput}
                      onChange={(e) => {
                        setMgmtPasswordInput(e.target.value);
                        setMgmtAuthError("");
                      }}
                      autoFocus
                      className="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none font-mono"
                    />
                    {mgmtAuthError && (
                      <p className="text-rose-400 text-[11px] font-semibold mt-1.5 text-center">
                        {mgmtAuthError}
                      </p>
                    )}
                  </div>

                  <div className="flex gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setIsMgmtAuthModalOpen(false)}
                      className="flex-1 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 transition-colors"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-xs font-bold text-slate-950 transition-colors shadow-lg shadow-amber-500/20"
                    >
                      Authorize
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: ADD / EDIT AGENT */}
          {isAgentModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                  <h3 className="text-base font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2">
                    <i data-lucide={modalMode === "add" ? "user-plus" : "user-check"} className="w-4 h-4"></i>
                    {modalMode === "add" ? "Add New Agent" : "Edit Agent Details"}
                  </h3>
                  <button onClick={() => setIsAgentModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleSaveAgentForm} className="space-y-3.5 text-xs">
                  <div>
                    <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Full Name</label>
                    <input
                      type="text"
                      required
                      value={currentAgentData.name}
                      onChange={(e) => setCurrentAgentData({ ...currentAgentData, name: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2 text-white focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Country</label>
                    <select
                      value={currentAgentData.country}
                      onChange={(e) => setCurrentAgentData({ ...currentAgentData, country: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2 text-white focus:outline-none"
                    >
                      {COUNTRY_LIST.map(c => (
                        <option key={c} value={c}>{c}</option>
                      ))}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Team / Department</label>
                      <input
                        type="text"
                        value={currentAgentData.team}
                        onChange={(e) => setCurrentAgentData({ ...currentAgentData, team: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2 text-white focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Direct Supervisor</label>
                      <input
                        type="text"
                        value={currentAgentData.supervisor}
                        onChange={(e) => setCurrentAgentData({ ...currentAgentData, supervisor: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2 text-white focus:outline-none"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3 pt-1">
                    <div>
                      <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Check In</label>
                      <input
                        type="text"
                        value={currentAgentData.checkIn}
                        onChange={(e) => setCurrentAgentData({ ...currentAgentData, checkIn: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2 text-white font-mono focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Check Out</label>
                      <input
                        type="text"
                        value={currentAgentData.checkOut}
                        onChange={(e) => setCurrentAgentData({ ...currentAgentData, checkOut: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2 text-white font-mono focus:outline-none"
                      />
                    </div>
                  </div>

                  <div className="pt-2 flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span className="text-slate-300 font-semibold">Required to Work This Holiday?</span>
                    <button
                      type="button"
                      onClick={() => setCurrentAgentData({ ...currentAgentData, isRequired: !currentAgentData.isRequired })}
                      className={`px-3 py-1 rounded-full text-[11px] font-bold border uppercase transition-colors ${
                        currentAgentData.isRequired
                          ? "bg-amber-400 text-slate-950 border-amber-300"
                          : "bg-slate-800 text-slate-400 border-slate-700"
                      }`}
                    >
                      {currentAgentData.isRequired ? "YES" : "NO"}
                    </button>
                  </div>

                  <div className="flex gap-2 pt-3 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setIsAgentModalOpen(false)}
                      className="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 transition-colors"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-xs font-bold text-slate-950 transition-colors shadow-lg shadow-amber-500/20"
                    >
                      Save Agent
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
