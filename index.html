                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Check In</label>
                      <input
                        type="text"
                        placeholder="(Keep current)"
                        value={bulkEditFields.checkIn}
                        onChange={(e) => setBulkEditFields({ ...bulkEditFields, checkIn: e.target.value })}
                        className={`w-full border rounded-xl px-3 py-2 font-mono focus:outline-none ${
                          isDarkMode ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-900"
                        }`}
                      />
                    </div>

                    <div>
                      <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Check Out</label>
                      <input
                        type="text"
                        placeholder="(Keep current)"
                        value={bulkEditFields.checkOut}
                        onChange={(e) => setBulkEditFields({ ...bulkEditFields, checkOut: e.target.value })}
                        className={`w-full border rounded-xl px-3 py-2 font-mono focus:outline-none ${
                          isDarkMode ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-900"
                        }`}
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Required to Work?</label>
                    <select
                      value={bulkEditFields.isRequired}
                      onChange={(e) => setBulkEditFields({ ...bulkEditFields, isRequired: e.target.value })}
                      className={`w-full border rounded-xl px-3 py-2 focus:outline-none ${
                        isDarkMode ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-900"
                      }`}
                    >
                      <option value="">(Keep current)</option>
                      <option value="true">YES • REQUIRED</option>
                      <option value="false">NO • OFF</option>
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Status Comment</label>
                      <select
                        value={bulkEditFields.commentType}
                        onChange={(e) => setBulkEditFields({ ...bulkEditFields, commentType: e.target.value })}
                        className={`w-full border rounded-xl px-3 py-2 focus:outline-none ${
                          isDarkMode ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-900"
                        }`}
                      >
                        <option value="">(Keep current)</option>
                        <option value="Shift Completed">Shift Completed</option>
                        <option value="Early Out at">Early Out at</option>
                        <option value="Late In at">Late In at</option>
                        <option value="Not Required to Come">Not Required to Come</option>
                      </select>
                    </div>

                    <div>
                      <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Detail / Reason / Time</label>
                      {bulkEditFields.commentType === "Not Required to Come" ? (
                        <select
                          value={bulkEditFields.commentDetail}
                          onChange={(e) => setBulkEditFields({ ...bulkEditFields, commentDetail: e.target.value })}
                          className={`w-full border rounded-xl px-3 py-2 focus:outline-none ${
                            isDarkMode ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-900"
                          }`}
                        >
                          <option value="">(Select reason)</option>
                          {NOT_REQUIRED_REASONS.map(r => (
                            <option key={r} value={r}>{r}</option>
                          ))}
                        </select>
                      ) : (
                        <input
                          type="text"
                          placeholder="e.g. 2:30 PM"
                          value={bulkEditFields.commentDetail}
                          onChange={(e) => setBulkEditFields({ ...bulkEditFields, commentDetail: e.target.value })}
                          className={`w-full border rounded-xl px-3 py-2 focus:outline-none ${
                            isDarkMode ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-900"
                          }`}
                        />
                      )}
                    </div>
                  </div>

                  <div className={`flex gap-2 pt-3 border-t ${isDarkMode ? "border-slate-800" : "border-slate-200"}`}>
                    <button
                      type="button"
                      onClick={() => setIsBulkEditModalOpen(false)}
                      className="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 transition-colors"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-xs font-bold text-slate-950 transition-colors shadow-lg shadow-amber-500/20"
                    >
                      Apply Changes
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: AGREGAR NUEVO HOLIDAY */}
          {isNewHolidayModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`border rounded-2xl max-w-sm w-full p-6 shadow-2xl relative ${
                isDarkMode ? "bg-slate-900 border-amber-500/50" : "bg-white border-amber-400 text-slate-900"
              }`}>
                <div className="w-12 h-12 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-500 dark:text-amber-400 mx-auto mb-3">
                  <i data-lucide="calendar-plus" className="w-6 h-6"></i>
                </div>
                <h3 className={`text-center text-base font-bold uppercase tracking-wider ${isDarkMode ? "text-white" : "text-slate-900"}`}>
                  Add New Holiday
                </h3>
                <p className="text-center text-xs text-slate-500 dark:text-slate-400 mt-1">
                  Create a new holiday to manage its attendance independently.
                </p>

                <form onSubmit={handleCreateHoliday} className="mt-4 space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Holiday Name</label>
                    <input
                      type="text"
                      placeholder="e.g. Good Friday, Local Holiday"
                      required
                      value={newHolidayName}
                      onChange={(e) => setNewHolidayName(e.target.value)}
                      autoFocus
                      className={`w-full border rounded-xl px-3 py-2 focus:outline-none ${
                        isDarkMode ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-900"
                      }`}
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Date (Optional label)</label>
                    <input
                      type="text"
                      placeholder="e.g. Apr 3, 2026"
                      value={newHolidayDate}
                      onChange={(e) => setNewHolidayDate(e.target.value)}
                      className={`w-full border rounded-xl px-3 py-2 focus:outline-none ${
                        isDarkMode ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-900"
                      }`}
                    />
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsNewHolidayModalOpen(false)}
                      className="flex-1 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 transition-colors"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-xs font-bold text-slate-950 transition-colors shadow-lg shadow-amber-500/20"
                    >
                      Create
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: CAMBIO DE PAÍS */}
          {isCountryAuthOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`border rounded-2xl max-w-sm w-full p-6 shadow-2xl relative ${
                isDarkMode ? "bg-slate-900 border-amber-500/50" : "bg-white border-amber-400 text-slate-900"
              }`}>
                <div className="w-12 h-12 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-500 dark:text-amber-400 mx-auto mb-3">
                  <i data-lucide="key" className="w-6 h-6"></i>
                </div>
                <h3 className={`text-center text-base font-bold uppercase tracking-wider ${isDarkMode ? "text-white" : "text-slate-900"}`}>
                  Access Authorization
                </h3>
                <p className="text-center text-xs text-slate-500 dark:text-slate-400 mt-1">
                  Enter password to access <span className="font-bold text-amber-500 dark:text-amber-400">{targetCountry}</span> team roster.
                </p>

                <form onSubmit={handleVerifyCountryPassword} className="mt-4 space-y-3">
                  <div>
                    <input
                      type="password"
                      placeholder={`Enter password for ${targetCountry}`}
                      value={countryPasswordInput}
                      onChange={(e) => {
                        setCountryPasswordInput(e.target.value);
                        setCountryAuthError("");
                      }}
                      autoFocus
                      className={`w-full border rounded-xl px-3 py-2 text-xs focus:outline-none font-mono ${
                        isDarkMode ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-900"
                      }`}
                    />
                    {countryAuthError && (
                      <p className="text-rose-500 text-[11px] font-semibold mt-1.5 text-center">
                        {countryAuthError}
                      </p>
                    )}
                  </div>

                  <div className="flex gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setIsCountryAuthOpen(false)}
                      className="flex-1 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 transition-colors"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-xs font-bold text-slate-950 transition-colors shadow-lg shadow-amber-500/20"
                    >
                      Unlock Country
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: AUTH MANAGEMENT */}
          {isMgmtAuthModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`border rounded-2xl max-w-sm w-full p-6 shadow-2xl relative ${
                isDarkMode ? "bg-slate-900 border-amber-500/40" : "bg-white border-amber-400 text-slate-900"
              }`}>
                <div className="w-12 h-12 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-500 dark:text-amber-400 mx-auto mb-3">
                  <i data-lucide="lock" className="w-6 h-6"></i>
                </div>
                <h3 className={`text-center text-base font-bold uppercase tracking-wider ${isDarkMode ? "text-white" : "text-slate-900"}`}>
                  Management Authentication
                </h3>
                <p className="text-center text-xs text-slate-500 dark:text-slate-400 mt-1">
                  {mgmtActionPayload?.type === "SELECT_ALL_COUNTRIES" 
                    ? "Enter management credentials to view all countries simultaneously."
                    : mgmtActionPayload?.type === "BULK_DELETE"
                    ? `Enter credentials to permanently remove ${mgmtActionPayload.payload.size} selected agent(s).`
                    : mgmtActionPayload?.type === "BULK_EDIT_MODAL"
                    ? `Enter credentials to modify ${selectedAgentIds.size} selected agent(s) in bulk.`
                    : mgmtActionPayload?.type === "REMOVE_HOLIDAY"
                    ? `Enter credentials to permanently delete holiday: "${holidaysList.find(h => h.id === mgmtActionPayload.payload)?.name || mgmtActionPayload.payload}".`
                    : "Enter authorized credentials to modify agent roster data."}
                </p>

                <form onSubmit={handleVerifyMgmtPassword} className="mt-4 space-y-3">
                  <div>
                    <input
                      type="password"
                      placeholder="Enter management password"
                      value={mgmtPasswordInput}
                      onChange={(e) => {
                        setMgmtPasswordInput(e.target.value);
                        setMgmtAuthError("");
                      }}
                      autoFocus
                      className={`w-full border rounded-xl px-3 py-2 text-xs focus:outline-none font-mono ${
                        isDarkMode ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-900"
                      }`}
                    />
                    {mgmtAuthError && (
                      <p className="text-rose-500 text-[11px] font-semibold mt-1.5 text-center">
                        {mgmtAuthError}
                      </p>
                    )}
                  </div>

                  <div className="flex gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setIsMgmtAuthModalOpen(false)}
                      className="flex-1 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 transition-colors"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-xs font-bold text-slate-950 transition-colors shadow-lg shadow-amber-500/20"
                    >
                      Authorize
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: ADD / EDIT SINGLE AGENT */}
          {isAgentModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`border rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto ${
                isDarkMode ? "bg-slate-900 border-slate-700" : "bg-white border-slate-300 text-slate-900"
              }`}>
                <div className={`flex items-center justify-between border-b pb-3 mb-4 ${isDarkMode ? "border-slate-800" : "border-slate-200"}`}>
                  <h3 className="text-base font-bold text-amber-500 dark:text-amber-400 uppercase tracking-wider flex items-center gap-2">
                    <i data-lucide={modalMode === "add" ? "user-plus" : "user-check"} className="w-4 h-4"></i>
                    {modalMode === "add" ? "Add New Agent" : "Edit Agent Details"}
                  </h3>
                  <button onClick={() => setIsAgentModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleSaveAgentForm} className="space-y-3.5 text-xs">
                  <div>
                    <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Full Name</label>
                    <input
                      type="text"
                      required
                      value={currentAgentData.name}
                      onChange={(e) => setCurrentAgentData({ ...currentAgentData, name: e.target.value })}
                      className={`w-full border rounded-xl px-3 py-2 focus:outline-none ${
                        isDarkMode ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-900"
                      }`}
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Country</label>
                    <select
                      value={currentAgentData.country}
                      onChange={(e) => setCurrentAgentData({ ...currentAgentData, country: e.target.value })}
                      className={`w-full border rounded-xl px-3 py-2 focus:outline-none ${
                        isDarkMode ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-900"
                      }`}
                    >
                      {COUNTRY_LIST.map(c => (
                        <option key={c} value={c} className="bg-slate-900 text-white">{c}</option>
                      ))}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Team / Department</label>
                      <input
                        type="text"
                        value={currentAgentData.team}
                        onChange={(e) => setCurrentAgentData({ ...currentAgentData, team: e.target.value })}
                        className={`w-full border rounded-xl px-3 py-2 focus:outline-none ${
                          isDarkMode ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-900"
                        }`}
                      />
                    </div>

                    <div>
                      <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Direct Supervisor</label>
                      <input
                        type="text"
                        value={currentAgentData.supervisor}
                        onChange={(e) => setCurrentAgentData({ ...currentAgentData, supervisor: e.target.value })}
                        className={`w-full border rounded-xl px-3 py-2 focus:outline-none ${
                          isDarkMode ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-900"
                        }`}
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3 pt-1">
                    <div>
                      <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Check In</label>
                      <input
                        type="text"
                        value={currentAgentData.checkIn}
                        onChange={(e) => setCurrentAgentData({ ...currentAgentData, checkIn: e.target.value })}
                        className={`w-full border rounded-xl px-3 py-2 font-mono focus:outline-none ${
                          isDarkMode ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-900"
                        }`}
                      />
                    </div>

                    <div>
                      <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">Check Out</label>
                      <input
                        type="text"
                        value={currentAgentData.checkOut}
                        onChange={(e) => setCurrentAgentData({ ...currentAgentData, checkOut: e.target.value })}
                        className={`w-full border rounded-xl px-3 py-2 font-mono focus:outline-none ${
                          isDarkMode ? "bg-slate-950 border-slate-700 focus:border-amber-400 text-white" : "bg-slate-50 border-slate-300 focus:border-amber-500 text-slate-900"
                        }`}
                      />
                    </div>
                  </div>

                  <div className={`pt-2 flex items-center justify-between p-3 rounded-xl border ${
                    isDarkMode ? "bg-slate-950 border-slate-800" : "bg-slate-50 border-slate-200"
                  }`}>
                    <span className="font-semibold">Required to Work This Holiday?</span>
                    <button
                      type="button"
                      onClick={() => setCurrentAgentData({ ...currentAgentData, isRequired: !currentAgentData.isRequired })}
                      className={`px-3 py-1 rounded-full text-[11px] font-bold border uppercase transition-colors ${
                        currentAgentData.isRequired
                          ? "bg-amber-400 text-slate-950 border-amber-300"
                          : (isDarkMode ? "bg-slate-800 text-slate-400 border-slate-700" : "bg-slate-200 text-slate-600 border-slate-300")
                      }`}
                    >
                      {currentAgentData.isRequired ? "YES" : "NO"}
                    </button>
                  </div>

                  <div className={`flex gap-2 pt-3 border-t ${isDarkMode ? "border-slate-800" : "border-slate-200"}`}>
                    <button
                      type="button"
                      onClick={() => setIsAgentModalOpen(false)}
                      className="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 transition-colors"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-xs font-bold text-slate-950 transition-colors shadow-lg shadow-amber-500/20"
                    >
                      Save Agent
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
